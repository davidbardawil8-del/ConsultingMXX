function filterRatingReviews(r){
  const s=APP.students[0];
  const filtered=s.reviews.filter(rev=>rev.r===r);
  const container=document.getElementById('rating-reviews-filtered');
  if(!container)return;
  if(!filtered.length){container.innerHTML=`<div class="cs2" style="text-align:center;padding:16px">Sin reseñas escritas para ${r}★</div>`;return;}
  container.innerHTML=`<div style="font-size:12px;font-weight:600;color:var(--t2);margin-bottom:10px">Reseñas de ${r}★</div>`+
    filtered.map(rev=>`<div style="border:2px solid ${r>=4?'#F59E0B':'var(--rose)'};border-radius:var(--rs);padding:12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <div style="font-weight:600;font-size:13px">${rev.company}</div>

function openMatchModal(projId){
  const p=APP.projects.find(x=>x.id===projId);if(!p)return;
  const candidates=APP.students.filter(s=>s.available&&s.status!=='inactive').map(s=>({...s,ms:matchScore(s,p)})).sort((a,b)=>b.ms-a.ms);
  openModal('Candidatos para: '+p.name,`
    <div class="cs" style="margin-bottom:14px">La empresa (<b>${p.client}</b>) verá estos candidatos y elegirá. Los % incluyen área, habilidades y rating.</div>
    ${candidates.map(s=>`
      <div class="card card-hover" style="margin-bottom:10px" onclick="selectCandidate(${p.id},${s.id})">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="display:flex;gap:10px;align-items:center">${ava(s.init,s.cls,36)}<div><div style="font-weight:600">${s.name}</div><div class="cs">${s.area} · ${s.career} · ${s.uni}</div></div></div>
          <div style="text-align:right"><div style="font-size:18px;font-weight:700;color:var(--g3)">${s.ms}%</div><div class="cs2">match</div></div>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">${s.skills.slice(0,3).map(sk=>`<span class="tag">${sk}</span>`).join('')}</div>
        <div style="margin-top:6px;font-size:11px;color:var(--t3)">★ ${s.rating} · ${s.projects} proyectos · ${s.hrs}h/sem</div>
      </div>`).join('')}
    <div style="background:var(--g-ll);border-radius:var(--rs);padding:10px;font-size:12px;color:var(--g1);margin-top:8px">${ic('user',13,'var(--g3)')} La empresa ve estos candidatos y elige. Notifícale cuando estén listos.</div>
  `,`${btn('Notificar a empresa','btn-g',false,`notifyCompany(${projId})`)}`);
}
function selectCandidate(projId,studId){
  showToast('Candidato seleccionado — esperando confirmación de empresa','info');
}
function notifyCompany(projId){
  const p=APP.projects.find(x=>x.id===projId);
  closeModal();showToast(`${p?.client||'Empresa'} notificada para seleccionar candidato`,'success');
}

      goal:0,
    };
  }
  const s=APP.simState;
  const prices={
    basico:{mensual:0,trimestral:0,semestral:0,anual:0},

  const plans=['basico','pro','empresa'];
  const cycles=['mensual','trimestral','semestral','anual'];
  const cycleLabel={mensual:'Mensual',trimestral:'Trimestral',semestral:'Semestral',anual:'Anual'};

  const planColor={basico:'var(--t2)',pro:'var(--g3)',empresa:'#0f2d1e'};

  // Compute initial totals
  let totalMem=0;

  const totalProjs=Math.round(totalCo*(s.projsPerCo||1.5));
  const com=Math.round(totalProjs*(s.revPerProj||7000)*.3);

  return`

            </div>

              ${cycles.reduce((a,cy)=>a+(s[pl+'_'+cy]||0),0)} empresas

            ${cycles.map(cy=>`

                    onmouseenter="this.style.background='var(--sb)'" onmouseleave="this.style.background='var(--raised)'">−</button>

        {label:'Cursos (30%)',id:'sim-cur-out',val:cur,col:'var(--amb)',note:(s.coursesCount||6)+' cursos activos',bar:2},
      ].map((r,i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--sb)">
          <div>
            <div class="cs" style="font-weight:500">${r.label}</div>
            <div id="sim-note-${i}" class="cs2">${r.note}</div>
          </div>
          <div style="text-align:right">
            <div id="${r.id}" style="font-family:'JetBrains Mono',monospace;font-weight:700;color:${r.col};font-size:15px">${fmtMXN(r.val)}</div>
          </div>
        </div>`).join('')}
      <!-- Visual bars -->
      <div style="display:flex;align-items:flex-end;gap:8px;height:80px;margin-top:16px;padding:0 4px">
        ${(()=>{
          const vals=[totalMem,com,cur];
          const maxV=Math.max(...vals,1);
          return vals.map((v,i)=>{
            const px=Math.max(4,Math.round(v/maxV*68));
            const col=i<2?'var(--g3)':'var(--amb)';
            const lbl=['Membresías','Comisiones','Cursos'][i];
            return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
              <div style="font-size:9px;font-weight:600;color:${col};font-family:'JetBrains Mono',monospace;height:12px;display:flex;align-items:center">${Math.round(v/1000)}k</div>
              <div class="sim-bar" id="sim-bar-${i}" style="width:100%;height:${px}px;border-radius:4px 4px 0 0;background:${col};transition:height .4s ease;flex-shrink:0"></div>
              <div style="font-size:10px;color:var(--t3)">${lbl}</div>
            </div>`;
          }).join('');
        })()}
      </div>
    </div>

    <!-- Plan breakdown table -->
    <div class="card" style="margin-bottom:12px">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px">Membresías desglosadas por plan</div>
      ${plans.map(pl=>{
        const plCo=cycles.reduce((a,cy)=>a+(s[pl+'_'+cy]||0),0);
        const plTotal=cycles.reduce((a,cy)=>a+(s[pl+'_'+cy]||0)*prices[pl][cy],0);
        if(!plCo)return`<div style="padding:6px 0;border-bottom:1px solid var(--sb);display:flex;justify-content:space-between"><span class="cs" style="color:var(--t4)">Plan ${planLabel[pl]}</span><span class="cs2">Sin empresas</span></div>`;
        return`<div style="padding:8px 0;border-bottom:1px solid var(--sb)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:12px;font-weight:600;color:${planColor[pl]}">Plan ${planLabel[pl]}</span>
            <span id="sim-plan-total-${pl}" style="font-weight:700;font-family:'JetBrains Mono',monospace;color:${planColor[pl]}">${fmtMXN(plTotal)}/mes</span>
          </div>
          <div class="cs2">${cycles.filter(cy=>(s[pl+'_'+cy]||0)>0).map(cy=>`${s[pl+'_'+cy]} ${cycleLabel[cy].toLowerCase()} ($${prices[pl][cy].toLocaleString('es-MX')}/mes)`).join(' · ')}</div>
        </div>`;
      }).join('')}
    </div>

    <!-- Recommendations -->
    <div class="card" style="background:var(--sl)">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        ${ic('trend',14,'var(--g3)')}
        <div style="font-size:13px;font-weight:700">Recomendaciones</div>
        <span style="font-size:10px;color:var(--t3);margin-left:auto">Se actualiza en tiempo real</span>
      </div>
      <div id="sim-recs"></div>
    </div>
  </div>
</div>`;
};

function simAdjust(plan, cycle, delta){
  if(!APP.simState)return;
  const key=plan+'_'+cycle;
  APP.simState[key]=Math.max(0,(APP.simState[key]||0)+delta);
  // Update the value display
  const valEl=document.getElementById('sim-val-'+plan+'-'+cycle);
  if(valEl)valEl.textContent=APP.simState[key];
  // Update sub label
  const prices={basico:{mensual:0,trimestral:0,semestral:0,anual:0},pro:{mensual:2500,trimestral:2250,semestral:2150,anual:2000},empresa:{mensual:4950,trimestral:4455,semestral:4207.5,anual:3960}};
  const subEl=document.getElementById('sim-sub-'+plan+'-'+cycle);
  if(subEl)subEl.textContent=prices[plan][cycle]>0?fmtMXN(APP.simState[key]*prices[plan][cycle])+'/mes':'—';
  // Update plan total label
  const cycles2=['mensual','trimestral','semestral','anual'];
  const plCo=cycles2.reduce((a,cy)=>a+(APP.simState[plan+'_'+cy]||0),0);
  const lblEl=document.getElementById('lbl-total-'+plan);
  if(lblEl)lblEl.textContent=plCo+' empresa'+(plCo!==1?'s':'');
  // Update total companies
  const allPlans=['basico','pro','empresa'];
  const allCo=allPlans.reduce((a,pl)=>a+cycles2.reduce((b,cy)=>b+(APP.simState[pl+'_'+cy]||0),0),0);
  const coEl=document.getElementById('sim-total-co');
  if(coEl)coEl.textContent=allCo;
  // Run full recalculation
  updateSimResults();
}


function updateSimResults(){
  const s=APP.simState;if(!s)return;
  const prices={basico:{mensual:0,trimestral:0,semestral:0,anual:0},pro:{mensual:2500,trimestral:2250,semestral:2150,anual:2000},empresa:{mensual:4950,trimestral:4455,semestral:4207.5,anual:3960}};
  const plans=['basico','pro','empresa'];const cycles=['mensual','trimestral','semestral','anual'];
  let totalMem=0;
  plans.forEach(pl=>cycles.forEach(cy=>{totalMem+=(s[pl+'_'+cy]||0)*prices[pl][cy];}));
  const totalCo=plans.reduce((a,pl)=>a+cycles.reduce((b,cy)=>b+(s[pl+'_'+cy]||0),0),0);
  const totalProjs=Math.round(totalCo*(s.projsPerCo||1.5));
  const revPerProj=s.revPerProj||7000;
  const com=Math.round(totalProjs*revPerProj*.3);
  const cur=Math.round((s.coursesCount||6)*(s.studPerCourse||18)*(s.pricePerCourse||1400)*.3);
  const tot=totalMem+com+cur;

  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};

  // Main totals
  set('sim-tot',fmtMXN(tot));
  set('sim-mem',fmtMXN(totalMem));
  set('sim-com',fmtMXN(com));
  set('sim-cur-out',fmtMXN(cur));
  set('sim-yr',fmtMXN(tot*12));
  set('sim-partner',fmtMXN(tot*12/2));
  set('sim-total-co',String(totalCo));

  // Notes
  set('sim-note-0',totalCo+' empresas activas');
  set('sim-note-1',totalProjs+' proyectos/mes');
  set('sim-note-2',(s.coursesCount||6)+' cursos activos');

  // Bars
  const vals=[totalMem,com,cur];const maxV=Math.max(...vals,1);
  vals.forEach((v,i)=>{
    const b=document.getElementById('sim-bar-'+i);
    if(b)b.style.height=Math.max(4,Math.round(v/maxV*68))+'px';
    // Update bar value label (the div just above the bar)
    const lbl=b?b.previousElementSibling:null;
    if(lbl)lbl.textContent=Math.round(v/1000)+'k';
  });

  // Plan breakdown
  plans.forEach(pl=>{
    const plTotal=cycles.reduce((a,cy)=>a+(s[pl+'_'+cy]||0)*prices[pl][cy],0);
    const plEl=document.getElementById('sim-plan-total-'+pl);
    if(plEl)plEl.textContent=fmtMXN(plTotal)+'/mes';
  });

  // Goal check
  const goal=s.goal||0;const goalEl=document.getElementById('sim-goal-msg');
  if(goalEl&&goal>0){
    const diff=tot-goal;
    goalEl.textContent=diff>=0?'✓ Meta alcanzada — '+fmtMXN(diff)+' por encima':'Faltan '+fmtMXN(Math.abs(diff))+' para tu meta';
    goalEl.style.color=diff>=0?'var(--g3)':'var(--rose)';
  } else if(goalEl)goalEl.textContent='';

  // Recommendations
  const recsEl=document.getElementById('sim-recs');
  if(recsEl){
    const recs=[];
    if(totalCo<10)recs.push({t:'Crece la base de empresas',d:'Con '+totalCo+' empresas el ingreso por membresías es limitado. Llegar a 15-20 empresas lo duplicaría.'});
    if(com>totalMem)recs.push({t:'Comisiones superan a membresías',d:'Considera más empresas en Plan Pro o Empresa para estabilizar con ingresos recurrentes.'});
    if((s.projsPerCo||1.5)<2)recs.push({t:'Incentiva más proyectos por empresa',d:'Subir de '+((s.projsPerCo||1.5).toFixed(1))+' a 2.5 proy/empresa generaría '+fmtMXN(Math.round(totalCo*1*revPerProj*.3))+' más en comisiones.'});
    const proCount=cycles.reduce((a,cy)=>a+(s['pro'+'_'+cy]||0),0);
    const basicCount=cycles.reduce((a,cy)=>a+(s['basico'+'_'+cy]||0),0);
    if(basicCount>proCount)recs.push({t:'Convierte empresas del plan gratuito',d:basicCount+' empresas en plan gratuito. Moverlas a Pro generaría '+fmtMXN(basicCount*2500)+'/mes más.'});
    if(goal>0&&tot<goal)recs.push({t:'Faltan '+fmtMXN(goal-tot)+' para tu meta',d:'Podrías alcanzarla con '+Math.ceil((goal-tot)/2500)+' empresas más en Plan Pro o '+Math.ceil((goal-tot)/(revPerProj*.3))+' proyectos adicionales al mes.'});
    if(!recs.length)recs.push({t:'¡Buen escenario!',d:'Tus parámetros proyectan un ingreso saludable de '+fmtMXN(tot)+'/mes. Prueba aumentar proyectos por empresa para maximizar comisiones.'});
    recsEl.innerHTML=recs.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--sb)"><div style="font-size:12px;font-weight:600;margin-bottom:2px">${r.t}</div><div class="cs2">${r.d}</div></div>`).join('');
  }
}

  const np=document.getElementById('notif-panel');
  if(np.classList.contains('open')&&!np.contains(e.target)&&!document.getElementById('notif-btn').contains(e.target))
    np.classList.remove('open');
