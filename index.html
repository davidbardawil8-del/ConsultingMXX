<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Plataforma de Consultoría Universitaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* Verde oscuro NEXUS — igual al v0 */
  --g1:#0f2d1e;--g2:#1a3a2a;--g3:#1a3a2a;--g4:#2d5a3d;--g5:#3d7a55;
  --g-l:#c8e6d4;--g-ll:#f0f7f2;--g-d:#0a1f14;
  /* Negros editorial */
  --bk:#0a0a0a;--bk2:#111111;--bk3:#1a1a1a;
  /* Blancos limpios */
  --wh:#ffffff;--wh2:#ffffff;--wh3:#f5f5f5;
  /* Texto negro editorial */
  --txt:#0a0a0a;--t2:#444444;--t3:#888888;--t4:#bbbbbb;
  /* Semánticos */
  --rose:#dc2626;--rose-l:#fee2e2;--rose-d:#991b1b;
  --amb:#d97706;--amb-l:#fef3c7;--amb-d:#92400e;
  --ind:#2563eb;--ind-l:#93c5fd;--ind-ll:#eff6ff;
  /* Bordes y superficies — grises neutros como v0 */
  --sb:#e5e5e5;--sm:#f5f5f5;--sl:#fafafa;
  /* Sombras casi invisibles */
  --sh:0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 2px 8px rgba(0,0,0,.08);--sh-lg:0 8px 32px rgba(0,0,0,.12);
  --sidebar-w:240px;--r:12px;--rs:8px;--rl:16px;
  --tr:all .15s ease;
}
/* Fondo con grid de líneas como v0 */
html,body{
  font-family:"Sora",sans-serif;
  background:#ffffff;
  color:var(--txt);
  min-height:100vh;
  font-size:14px;
  line-height:1.5;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(to right,#e8e8e8 1px,transparent 1px),
    linear-gradient(to bottom,#e8e8e8 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
  z-index:0;
  opacity:.4;
}
.layout,.sidebar,.topbar,.modal-ov,.search-ov,.confirm-ov{position:relative;z-index:1}
.content{position:relative;z-index:1}
/* LAYOUT */
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:#0a0a0a;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;transition:width .2s ease;border-right:1px solid #1a1a1a}
.sidebar.collapsed{width:52px}
.sidebar.collapsed .nav-lbl,.sidebar.collapsed .s-name,.sidebar.collapsed .s-section-lbl,.sidebar.collapsed .u-info,.sidebar.collapsed .sq-inner{display:none}
.sidebar.collapsed .nav-btn{justify-content:center;padding:9px 0}
.sidebar.collapsed .s-brand{justify-content:center;padding:16px 0}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .2s ease}
.main.expanded{margin-left:52px}
.s-brand{display:flex;align-items:center;gap:10px;padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.05)}
.s-logo{width:32px;height:32px;border-radius:6px;background:#1a3a2a;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:800;color:#fff;letter-spacing:-.5px}
.s-logo svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s-name{font-size:15px;font-weight:700;color:#ffffff;letter-spacing:-.3px;white-space:nowrap;font-family:"Sora",sans-serif}
.s-name span{color:#ffffff}
.s-section{padding:10px 10px 4px}
.s-section-lbl{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:.1em;text-transform:uppercase;padding:0 6px 6px;display:block}
.nav-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--rs);font-size:13px;font-weight:400;color:rgba(255,255,255,.5);background:none;border:none;cursor:pointer;text-align:left;font-family:"Sora",sans-serif;position:relative;transition:var(--tr);white-space:nowrap;overflow:hidden}
.nav-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.6}
.nav-btn:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.9)}
.nav-btn.on{background:#1a3a2a;color:#fff;font-weight:600}
.nav-btn.on svg{opacity:1}
.nav-btn .bdot{position:absolute;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.s-divider{height:1px;background:rgba(255,255,255,.06);margin:4px 10px}
.s-user{padding:10px;border-top:1px solid rgba(255,255,255,.06);margin-top:auto}
.s-user-inner{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;transition:var(--tr)}
.s-user-inner:hover{background:rgba(255,255,255,.07)}
.u-ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:"JetBrains Mono",monospace}
.u-info{flex:1;min-width:0}
.u-name{font-size:12px;font-weight:500;color:#fff}
.u-role{font-size:11px;color:rgba(255,255,255,.35)}
/* AVATAR COLORS */
.ag{background:var(--g3);color:#fff}.ar{background:#7C3AED;color:#fff}.ae{background:var(--ind);color:#fff}.aa{background:var(--amb);color:#fff}.ab{background:#374151;color:#9CA3AF}
/* TOPBAR */
.topbar{background:#ffffff;border-bottom:1px solid #e5e5e5;padding:0 24px;display:flex;align-items:center;height:52px;position:sticky;top:0;z-index:90;gap:8px;backdrop-filter:blur(8px)}
.tb-toggle{width:30px;height:30px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;color:var(--t2);transition:var(--tr)}
.tb-toggle:hover{background:var(--sm)}
.tb-mode{font-size:13px;color:#888888}.tb-sep{font-size:13px;color:#cccccc;margin:0 2px}.tb-page{font-size:14px;font-weight:700;color:#0a0a0a;letter-spacing:-.2px}
.topbar-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{width:34px;height:34px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;position:relative;transition:var(--tr)}
.icon-btn:hover{background:var(--sm)}
.icon-btn svg{width:16px;height:16px;stroke:var(--t2);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--rose);border:2px solid var(--wh);position:absolute;top:5px;right:5px;display:none}
.tava{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;font-family:"JetBrains Mono",monospace}
/* CONTENT */
.content{padding:24px 28px 60px;flex:1;transition:opacity .15s ease;background:transparent}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* HERO */
.hero{border-radius:var(--rl);padding:28px 30px;color:#fff;position:relative;overflow:hidden;margin-bottom:22px}
.hero-g{background:#0f2d1e}
.hero-bk{background:#0a0a0a}
.hero-ind{background:linear-gradient(135deg,#1E3A8A,#2563EB 55%,#3B82F6)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.04)}
.hero::before{content:"";position:absolute;right:80px;bottom:-70px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.03)}
.hero-eye{font-size:10px;font-weight:600;opacity:.5;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;font-family:"JetBrains Mono",monospace}
.hero-title{font-size:28px;font-weight:800;line-height:1.15;margin-bottom:6px;letter-spacing:-.6px;font-family:"Sora",sans-serif}
.hero-sub{font-size:13px;opacity:.75;line-height:1.5;max-width:580px}
.hero-chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hchip{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(255,255,255,.12);color:#fff}
.hchip-hi{background:rgba(255,255,255,.25);font-weight:600}
.hero-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hbtn{padding:8px 18px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:"Inter",sans-serif;transition:var(--tr)}
.hbtn-pri{background:#fff;color:var(--g1)}.hbtn-pri:hover{background:var(--g-ll);transform:translateY(-1px)}
.hbtn-gho{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}.hbtn-gho:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}
/* STATS */
.stat-grid{display:grid;gap:14px;margin-bottom:22px}
.sg2{grid-template-columns:repeat(2,1fr)}.sg3{grid-template-columns:repeat(3,1fr)}.sg4{grid-template-columns:repeat(4,1fr)}
.stat-card{background:#ffffff;border:1px solid #e5e5e5;border-radius:var(--r);padding:18px;box-shadow:none;cursor:pointer;position:relative;overflow:hidden;transition:var(--tr)}
.stat-card::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:transparent;transition:background .2s}
.stat-card:hover{border-color:#0a0a0a;box-shadow:var(--sh-md);transform:translateY(-1px)}
.stat-card:hover::after{background:#1a3a2a}
.stat-ico{width:36px;height:36px;border-radius:9px;margin-bottom:12px;display:flex;align-items:center;justify-content:center}
.si-g{background:var(--g-ll)}.si-bk{background:var(--wh3)}.si-r{background:var(--rose-l)}.si-a{background:var(--amb-l)}.si-i{background:var(--ind-ll)}
.stat-val{font-size:26px;font-weight:700;color:#0a0a0a;line-height:1;letter-spacing:-.8px;font-family:"JetBrains Mono",monospace;margin-bottom:4px}
.stat-lbl{font-size:12px;color:#666666;font-weight:500;letter-spacing:.01em}
.stat-delta{font-size:11px;color:var(--t3);margin-top:4px;font-family:"JetBrains Mono",monospace}
.stat-delta.up{color:var(--g4)}.stat-delta.dn{color:var(--rose)}
/* CARDS */
.card{background:#ffffff;border:1px solid #e5e5e5;border-radius:var(--r);padding:16px;box-shadow:none;margin-bottom:14px;transition:var(--tr)}
.card-hover{cursor:pointer}.card-hover:hover{border-color:#0a0a0a;box-shadow:0 2px 12px rgba(0,0,0,.07);transform:translateY(-1px)}
.card-g{border-left:3px solid var(--g3)}.card-r{border-left:3px solid var(--rose)}.card-a{border-left:3px solid var(--amb)}.card-i{border-left:3px solid var(--ind)}
/* GRID */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
/* SECTION HEADERS */
.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shdr-t{font-size:14px;font-weight:700;color:#0a0a0a;letter-spacing:-.2px}
.shdr-a{font-size:12px;color:var(--g3);cursor:pointer;font-weight:500;background:none;border:none;font-family:inherit;transition:var(--tr)}
.shdr-a:hover{color:var(--g1)}
/* TYPOGRAPHY */
.ct{font-size:14px;font-weight:600;color:#0a0a0a;letter-spacing:-.1px}.cs{font-size:12px;color:#555555}.cs2{font-size:11px;color:#888888}.mono{font-family:"JetBrains Mono",monospace}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:"Inter",sans-serif;transition:var(--tr);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-g{background:#1a3a2a;color:#fff;font-weight:600}.btn-g:hover{background:#0f2d1e}
.btn-bk{background:#0a0a0a;color:#fff;font-weight:600}.btn-bk:hover{background:#1a1a1a}
.btn-r{background:var(--rose);color:#fff}.btn-r:hover{background:var(--rose-d)}
.btn-sec{background:#f5f5f5;color:#444444;border:1px solid #e5e5e5}.btn-sec:hover{background:#e5e5e5;color:#0a0a0a}
.btn-ghost{background:transparent;color:#1a3a2a;border:1px solid #c8e6d4}.btn-ghost:hover{background:#f0f7f2}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:7px}
.btn-lg{padding:10px 22px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* BADGES */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.be{background:#f0f7f2;color:#1a3a2a;border:1px solid #c8e6d4}.ba{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}.bb{background:#fef3c7;color:#92400e;border:1px solid #fde68a}.br{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.bg2{background:#f5f5f5;color:#555555;border:1px solid #e5e5e5}
/* PROGRESS */
.prog{height:6px;background:var(--sb);border-radius:3px;overflow:hidden}
.prog-bar{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.pg{background:#1a3a2a}.pr{background:#dc2626}.pa{background:#d97706}.pi{background:#2563eb}
.pmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);font-family:"JetBrains Mono",monospace;margin-top:4px}
/* TABLE */
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--sb);background:var(--wh);box-shadow:var(--sh);margin-bottom:14px}
table{width:100%;border-collapse:collapse}
thead{background:#fafafa}
th{font-size:11px;font-weight:600;color:#888888;text-transform:uppercase;letter-spacing:.08em;padding:10px 14px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s}
th:hover{color:var(--txt)}
th.sort-asc::after{content:" ↑";color:var(--g3)}
th.sort-desc::after{content:" ↓";color:var(--g3)}
td{padding:12px 14px;font-size:13px;border-top:1px solid var(--sb);color:var(--txt);vertical-align:middle}
tr:hover td{background:var(--sl)}
/* FIELDS */
.field{width:100%;padding:9px 12px;border:1px solid #e5e5e5;border-radius:var(--rs);font-size:13px;font-family:"Sora",sans-serif;background:#ffffff;color:#0a0a0a;transition:border-color .15s,box-shadow .15s;outline:none}
.field:focus{border-color:#0a0a0a;box-shadow:0 0 0 3px rgba(10,10,10,.08)}
.field::placeholder{color:var(--t4)}
select.field{cursor:pointer}
.field-group{margin-bottom:14px}
.field-label{font-size:12px;font-weight:500;color:var(--t2);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.req{color:var(--rose);font-size:11px}
.field.invalid{border-color:var(--rose)}
/* PILLS */
.pill-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;background:#f5f5f5;color:#444444;border:1px solid #e5e5e5;cursor:pointer;transition:var(--tr);font-family:"Sora",sans-serif}
.pill:hover{background:#e5e5e5;color:#0a0a0a}
.pill.on{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
/* TABS */
.tab-bar{display:flex;border-bottom:2px solid #e5e5e5;margin-bottom:18px}
.tab-btn{padding:9px 16px;font-size:13px;font-weight:500;color:#888888;background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--tr);font-family:"Sora",sans-serif}
.tab-btn:hover{color:#0a0a0a}
.tab-btn.on{color:#0a0a0a;border-bottom-color:#0a0a0a;font-weight:700}
.tab-pane{display:none}.tab-pane.on{display:block;animation:fadeUp .2s ease}
/* CHAT */
.chat-wrap{background:var(--sl);border-radius:var(--r);border:1px solid var(--sb);padding:14px;height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px;scroll-behavior:smooth}
.msg{display:flex;flex-direction:column;max-width:82%}
.msg-me{align-self:flex-end;align-items:flex-end}
.msg-other{align-self:flex-start;align-items:flex-start}
.msg-name{font-size:10px;color:var(--t3);margin-bottom:3px;font-weight:500}
.msg-bubble{padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.45}
.msg-me .msg-bubble{background:var(--g3);color:#fff;border-bottom-right-radius:3px}
.msg-other .msg-bubble{background:var(--wh);border:1px solid var(--sb);color:var(--txt);border-bottom-left-radius:3px}
.msg-time{font-size:10px;color:var(--t3);margin-top:2px;font-family:"JetBrains Mono",monospace}
/* NOTIF PANEL */
.notif-panel{position:fixed;top:52px;right:0;width:340px;background:var(--wh);border-left:1px solid var(--sb);box-shadow:var(--sh-lg);z-index:200;max-height:calc(100vh - 52px);overflow-y:auto;transform:translateX(100%);transition:transform .2s ease}
.notif-panel.open{transform:translateX(0)}
.notif-panel-hdr{padding:14px 16px;border-bottom:1px solid var(--sb);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--wh);z-index:1}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--sb);cursor:pointer;transition:background .15s;display:flex;gap:10px;align-items:flex-start}
.notif-item:hover{background:var(--sl)}
.notif-item.unread{background:var(--g-ll)}
.notif-ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-t{font-size:13px;font-weight:500;color:var(--txt)}.notif-b{font-size:12px;color:var(--t2)}.notif-time{font-size:10px;color:var(--t3);font-family:"JetBrains Mono",monospace;margin-top:3px}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);padding:20px}
.modal-ov.open{display:flex;animation:fadeUp .15s ease}
.modal{background:#ffffff;border-radius:var(--rl);box-shadow:0 20px 60px rgba(0,0,0,.15);width:100%;max-width:600px;max-height:calc(100vh - 40px);overflow-y:auto}
.modal-hdr{padding:18px 22px 14px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#ffffff;z-index:1}
.modal-title{font-size:16px;font-weight:700;color:#0a0a0a;letter-spacing:-.3px}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--sb);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--wh)}
.close-btn{width:28px;height:28px;border-radius:6px;background:var(--sm);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:var(--tr)}
.close-btn:hover{background:var(--sb)}
/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.k-col{background:#fafafa;border-radius:var(--r);padding:12px;border:1px solid #e5e5e5;min-height:200px;transition:background .15s}
.k-col.drag-over{background:#f0f7f2;border-color:#1a3a2a}
.k-col-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.k-col-title{font-size:12px;font-weight:600;color:var(--txt)}
.k-count{min-width:20px;height:20px;border-radius:10px;background:var(--sb);color:var(--t2);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.k-card{background:var(--wh);border:1px solid var(--sb);border-radius:var(--rs);padding:12px;margin-bottom:8px;cursor:grab;box-shadow:var(--sh);transition:var(--tr);animation:fadeUp .2s ease}
.k-card:hover{box-shadow:var(--sh-md);border-color:var(--g4);transform:translateY(-1px)}
.k-card.dragging{opacity:.45;cursor:grabbing}
.k-drop-hint{height:48px;border:2px dashed var(--g4);border-radius:var(--rs);margin-bottom:8px;background:var(--g-ll);display:none;align-items:center;justify-content:center;font-size:12px;color:var(--g3)}
.k-col.drag-over .k-drop-hint{display:flex}
/* STARS */
.stars{display:flex;gap:2px}
.star{font-size:18px;cursor:pointer;color:var(--sb);transition:color .1s;user-select:none;line-height:1}
.star.on{color:#F59E0B}
.stars:hover .star{color:#F59E0B}
.stars:hover .star:hover ~ .star{color:var(--sb)}
/* SEARCH */
.search-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;display:none;align-items:flex-start;justify-content:center;padding-top:80px;backdrop-filter:blur(4px)}
.search-ov.open{display:flex;animation:fadeUp .15s ease}
.search-box{background:var(--wh);border-radius:var(--rl);box-shadow:var(--sh-lg);width:100%;max-width:540px;overflow:hidden}
.search-inp-wrap{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--sb)}
.search-inp{flex:1;font-size:15px;border:none;outline:none;font-family:"Inter",sans-serif;background:transparent;color:var(--txt)}
.search-inp::placeholder{color:var(--t4)}
.search-results{max-height:380px;overflow-y:auto}
.search-group{padding:8px 0}
.search-group-title{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;padding:4px 18px 6px}
.search-item{padding:10px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s}
.search-item:hover{background:var(--sl)}
.search-item-title{font-size:13px;font-weight:500;color:var(--txt)}
.search-item-sub{font-size:11px;color:var(--t3)}
.search-empty{padding:40px;text-align:center;color:var(--t3);font-size:13px}
/* TOAST */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bk);color:#fff;padding:10px 16px;border-radius:var(--rs);font-size:13px;font-weight:500;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:8px;max-width:340px;pointer-events:auto;animation:toastIn .25s ease;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(10px)}
.ts{background:var(--g3)}.te{background:var(--rose)}.tw2{background:var(--amb)}.ti{background:var(--ind)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
/* COURSE CARD */
.crs-card{background:var(--wh);border:1px solid var(--sb);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:var(--tr);box-shadow:var(--sh)}
.crs-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--g4)}
.crs-banner{height:90px;display:flex;align-items:center;justify-content:center;position:relative}
.crs-body{padding:14px}
.crs-title{font-size:14px;font-weight:600;color:var(--txt);line-height:1.3;margin-bottom:4px}
.crs-meta{font-size:11px;color:var(--t3)}
.crs-foot{padding:12px 14px;border-top:1px solid var(--sb);display:flex;align-items:center;justify-content:space-between}
/* WIZARD */
.wiz-steps{display:flex;align-items:center;margin-bottom:28px}
.wiz-step{display:flex;align-items:center;gap:8px;flex:1}
.wiz-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--sb);background:var(--wh);color:var(--t3);transition:var(--tr);flex-shrink:0}
.wiz-dot.done{background:var(--g3);border-color:var(--g3);color:#fff}
.wiz-dot.active{background:var(--bk);border-color:var(--bk);color:#fff;box-shadow:0 0 0 4px var(--wh3)}
.wiz-label{font-size:12px;color:var(--t3);font-weight:500;white-space:nowrap}
.wiz-label.active{color:var(--txt);font-weight:600}
.wiz-line{flex:1;height:2px;background:var(--sb);margin:0 6px}
.wiz-line.done{background:var(--g3)}
.wiz-pane{display:none}.wiz-pane.on{display:block;animation:fadeUp .2s ease}
/* AVA */
.ava{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;font-family:"JetBrains Mono",monospace}
/* MISC */
.dv{height:1px;background:var(--sb);margin:12px 0}
.tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:#f0f7f2;color:#1a3a2a;border:1px solid #c8e6d4}
.tag-r{background:var(--rose-l);color:var(--rose-d)}
input[type=range]{width:100%;accent-color:var(--g3);cursor:pointer}
/* CONFIRM */
.confirm-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:600;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.confirm-ov.open{display:flex;animation:fadeUp .15s}
.confirm-box{background:var(--wh);border-radius:var(--rl);padding:28px;max-width:400px;width:90%;box-shadow:var(--sh-lg)}
/* SKILL BARS */
.skill-bar-wrap{margin-bottom:10px}
.skill-bar-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:4px}
.skill-bar{height:7px;background:var(--sb);border-radius:4px;overflow:hidden}
.skill-bar-fill{height:100%;background:#1a3a2a;border-radius:4px;transition:width .8s cubic-bezier(.16,1,.3,1)}
/* TYPING */
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:typingPulse 1.2s infinite;display:inline-block}
.typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typingPulse{0%,60%,100%{transform:scale(1);opacity:.4}30%{transform:scale(1.3);opacity:1}}
/* GAUGE */
.gauge-wrap{position:relative;width:160px;margin:0 auto}
.gauge-svg{width:160px;height:90px}
/* CHATBOT */
.chatbot-btn{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:#1a3a2a;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:250;transition:var(--tr)}
.chatbot-btn:hover{background:#0f2d1e;transform:scale(1.08)}
.chatbot-win{position:fixed;bottom:88px;right:24px;width:340px;background:var(--wh);border-radius:var(--rl);box-shadow:var(--sh-lg);z-index:250;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--sb)}
.chatbot-win.open{display:flex;animation:fadeUp .2s ease}
.chatbot-hdr{background:var(--bk);padding:14px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.chatbot-msgs{height:280px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--sl)}
.chatbot-inp-row{padding:10px 12px;border-top:1px solid var(--sb);display:flex;gap:8px}
/* HISTOGRAM */
.hist-bar-wrap{display:flex;align-items:flex-end;gap:6px;height:100px;padding:0 4px}
.hist-bar{flex:1;border-radius:4px 4px 0 0;transition:height .5s cubic-bezier(.16,1,.3,1);cursor:pointer;position:relative}
.hist-bar:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100%+4px);left:50%;transform:translateX(-50%);background:var(--bk);color:#fff;font-size:10px;padding:3px 7px;border-radius:4px;white-space:nowrap;pointer-events:none}
/* FILTER ROW */
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
/* VELOCIMET GAUGE */
.speed-gauge{position:relative;text-align:center}
/* PLAN CARD */
.plan-card{background:var(--wh);border:2px solid var(--sb);border-radius:var(--r);padding:20px;transition:var(--tr);position:relative}
.plan-card.active-plan{border-color:var(--g3);box-shadow:0 0 0 3px var(--g-ll)}
.plan-card:hover{border-color:var(--g4);transform:translateY(-2px)}
/* RESP */
@media(max-width:900px){.sg4{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.sg3,.sg4{grid-template-columns:1fr}.content{padding:16px 16px 60px}}

@media(max-width:768px){

    transform:translateX(-100%);

const matchScore=(student,project)=>{
  let score=0;
  const areaMatch=student.area===project.area;
  if(areaMatch)score+=40;
  const skillMatch=project.tags.filter(t=>student.skills.some(s=>s.toLowerCase().includes(t.toLowerCase()))).length;
  score+=skillMatch*15;
  score+=student.rating*4;
  return Math.min(99,Math.round(score));
};

function setMode(m){
  APP.mode=m;
  document.querySelectorAll('.nav-btn[id^=mb-]').forEach(b=>b.classList.remove('on'));
  document.getElementById('mb-'+m).classList.add('on');
  const pf={emp:{ava:'TG',cls:'ag',name:'Tecno Grupo',role:'Plan Empresa'},est:{ava:'LA',cls:'ag',name:'Luis Acosta',role:'Estudiante · UANL'},dash:{ava:'NX',cls:'ar',name:'Nexus Admin',role:'Socio administrador'}}[m];
  document.getElementById('user-ava').textContent=pf.ava;
  document.getElementById('user-ava').className=`ava u-ava ${pf.cls}`;
  document.getElementById('tava').textContent=pf.ava;
  document.getElementById('tava').className=`ava tava ${pf.cls}`;
  document.getElementById('user-name').textContent=pf.name;
  document.getElementById('user-role').textContent=pf.role;
  buildSidebarNav(m);
  goTab(m,APP.tab[m]);
}
function buildSidebarNav(m){
  const unread=APP.notifications.filter(n=>!n.read).length;
  document.getElementById('sidebar-nav').innerHTML=NAV[m].map(item=>{
    const active=APP.tab[m]===item.id;
    const pendingMatch=m==='emp'&&item.id==='match'&&APP.projects.filter(p=>p.client==='Tecno Grupo'&&p.appliedStudents&&p.appliedStudents.length>0&&!p.selectedStudent).length>0;
      const badge=pendingMatch?`<div class="bdot">${APP.projects.filter(p=>p.client==='Tecno Grupo'&&p.appliedStudents&&p.appliedStudents.length>0&&!p.selectedStudent).length}</div>`:m==='emp'&&item.id==='msgs'&&unread>0?`<div class="bdot">${unread}</div>`:'';
    return`<button class="nav-btn${active?' on':''}" onclick="goTab('${m}','${item.id}')" id="nb-${item.id}">${ic(item.icon,15)}<span class="nav-lbl">${item.label}</span>${badge}</button>`;
  }).join('');
  const sq=document.getElementById('sidebar-quick');
  sq.innerHTML=m==='emp'?`<span class="s-section-lbl">Acceso rápido</span><div class="sq-inner">${btn(ic('plus',13)+' Proyecto','btn-g btn-sm',false,"goTab('emp','new')")}</div>`:'';
}
function goTab(m,t){
  APP.tab[m]=t;
  if(APP.mode!==m)setMode(m);
  document.querySelectorAll('#sidebar-nav .nav-btn').forEach(b=>b.classList.remove('on'));
  const nb=document.getElementById('nb-'+t);
  if(nb)nb.classList.add('on');
  document.getElementById('tb-mode').textContent=MODELABELS[m];
  document.getElementById('tb-page').textContent=TABS[m][t]||t;
  const fn=SCREENS[m]&&SCREENS[m][t];
  const ct=document.getElementById('content');
  ct.style.opacity='0';
  setTimeout(()=>{
    ct.innerHTML=fn?fn():`<div style="text-align:center;padding:80px;color:var(--t3)"><div style="font-size:40px;margin-bottom:12px">🚧</div><div style="font-size:16px;font-weight:600">En construcción</div></div>`;
    ct.style.opacity='1';
    ct.style.transition='opacity .18s ease';
    postRender(m,t);
    updateNotifDot();
    if(isMobile())closeSidebarMobile();
  },80);
}
function postRender(m,t){
  document.querySelectorAll('.pill[data-filter]').forEach(b=>{
    b.addEventListener('click',function(){
      const g=this.dataset.group;
      APP.filters[g]=this.dataset.filter;
      document.querySelectorAll(`.pill[data-group="${g}"]`).forEach(x=>x.classList.remove('on'));
      this.classList.add('on');
      document.querySelectorAll(`[data-filter-group="${g}"]`).forEach(el=>{
        const f=APP.filters[g];
        el.style.display=(f==='all'||f==='todos'||f===el.dataset.fval)?'':'none';
      });
    });
  });
  document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>sortTable(th)));
  setTimeout(()=>{
    document.querySelectorAll('.prog-bar[data-w]').forEach(b=>{b.style.width=b.dataset.w+'%'});
    document.querySelectorAll('.skill-bar-fill[data-w]').forEach(b=>{b.style.width=b.dataset.w+'%'});
  },60);
  if(m==='emp'&&t==='msgs')renderChat();
  if(m==='est'&&t==='msgs'){renderEstChat();renderEstChatFiles();}
  if(m==='dash'&&t==='kanban')initKanban();
  if(m==='emp'&&t==='new'){updateWizDots();setTimeout(calcMinBudget,80);}
  if(m==='dash'&&t==='rev')initRevFilters();
  if(m==='dash'&&t==='home')initDashFilters();
  if(m==='dash'&&t==='sim'){initSim();setTimeout(updateSimResults,80);}
}
function isMobile(){return window.innerWidth<=768;}
function toggleSidebar(){
  if(isMobile()){
    const sb=document.getElementById('sidebar');
    const isOpen=sb.classList.contains('mobile-open');
    if(isOpen){
      sb.classList.remove('mobile-open');
    } else {
      sb.classList.add('mobile-open');
    }
    return;
  }
  APP.sidebarCollapsed=!APP.sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed',APP.sidebarCollapsed);
  document.getElementById('main').classList.toggle('expanded',APP.sidebarCollapsed);
}
function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('mobile-open');
}
// Close sidebar when clicking outside on mobile
document.addEventListener('click',function(e){
  if(!isMobile())return;
  const sb=document.getElementById('sidebar');
  if(!sb.classList.contains('mobile-open'))return;
  if(!sb.contains(e.target)&&!document.querySelector('.tb-toggle').contains(e.target)){
    sb.classList.remove('mobile-open');
  }
});
function render(){goTab(APP.mode,APP.tab[APP.mode]);}

function openModal(title,body,foot=''){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  const mf=document.getElementById('modal-foot');
  if(foot){mf.innerHTML=foot;mf.style.display='flex';}else{mf.style.display='none';}
  document.getElementById('modal-ov').classList.add('open');
  setTimeout(()=>{
    document.querySelectorAll('#modal-body .prog-bar[data-w]').forEach(b=>{b.style.width=b.dataset.w+'%'});
    document.querySelectorAll('#modal-body .skill-bar-fill[data-w]').forEach(b=>{b.style.width=b.dataset.w+'%'});
  },100);
}
function closeModal(e){
  if(!e||e.target===document.getElementById('modal-ov'))
    document.getElementById('modal-ov').classList.remove('open');
}
function confirmAction(title,msg,onOk){
  document.getElementById('confirm-title').textContent=title;
  document.getElementById('confirm-msg').textContent=msg;
  document.getElementById('confirm-ov').classList.add('open');
  document.getElementById('confirm-ok').onclick=()=>{closeConfirm();onOk();};
}
function closeConfirm(){document.getElementById('confirm-ov').classList.remove('open');}

function approveProject(id){
  const p=APP.projects.find(x=>x.id===id);if(!p)return;
  confirmAction('¿Aprobar entregable?',`Esto marcará "${p.name}" como completado y liberará el pago.`,()=>{
    p.status='done';p.pct=100;
    APP.notifications.unshift({id:Date.now(),read:false,type:'success',title:'Proyecto aprobado',text:p.name,time:'Ahora',icon:'check',target:''});
    closeModal();showToast('Entregable aprobado — pago liberado','success');render();
  });
}
function requestRevision(id){
  openModal('Solicitar revisión',`
    <div class="cs" style="margin-bottom:10px">Describe los cambios necesarios:</div>
    <textarea class="field" id="rev-notes" rows="4" placeholder="Ej: Falta el escenario pesimista en el modelo..." style="resize:vertical"></textarea>

function enrollCourse(id){
  if(!APP.myEnrolledCourses.includes(id)){
    APP.myEnrolledCourses.push(id);
    const c=APP.courses.find(x=>x.id===id);
    if(c&&c.live)c.enrolled++;
    else if(c)c.enrolled++;
    closeModal();showToast('Inscrito exitosamente','success');render();
  }
}
function unenrollCourse(id){
  confirmAction('¿Cancelar inscripción?','Perderás tu acceso al curso.',()=>{
    APP.myEnrolledCourses=APP.myEnrolledCourses.filter(x=>x!==id);
    const c=APP.courses.find(x=>x.id===id);if(c)c.enrolled--;
    closeModal();showToast('Inscripción cancelada','info');render();
  });
}

function showToast(msg,type='info'){
  const el=document.createElement('div');
  const cls={success:'ts',error:'te',warning:'tw2',info:'ti'}[type]||'ti';
  const ico={success:'check',error:'x',warning:'alert',info:'bell'}[type]||'bell';
  el.className=`toast ${cls}`;
  el.innerHTML=ic(ico,14,'#fff')+`<span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},3200);
}

function doSearch(q){
  const res=document.getElementById('search-results');
  if(!q.trim()){res.innerHTML='<div class="search-empty">Escribe para buscar...</div>';return;}
  const ql=q.toLowerCase();
  const projs=APP.projects.filter(p=>p.name.toLowerCase().includes(ql)||p.type.toLowerCase().includes(ql)||p.consultant.toLowerCase().includes(ql));
  const studs=APP.students.filter(s=>s.name.toLowerCase().includes(ql)||s.career.toLowerCase().includes(ql)||s.skills.some(sk=>sk.toLowerCase().includes(ql)));

  if(!projs.length&&!studs.length&&!cours.length){res.innerHTML=`<div class="search-empty">Sin resultados para "${q}"</div>`;return;}

  if(studs.length)html+=`<div class="search-group"><div class="search-group-title">Estudiantes</div>${studs.map(s=>`<div class="search-item" onclick="openStudentModal(${s.id});closeSearch()">${ava(s.init,s.cls,28)}<div><div class="search-item-title">${s.name}</div><div class="search-item-sub">${s.career} · ${s.uni}</div></div></div>`).join('')}</div>`;
  if(cours.length)html+=`<div class="search-group"><div class="search-group-title">Cursos</div>${cours.map(c=>`<div class="search-item" onclick="openCourseModal(${c.id});closeSearch()"><div style="width:28px;height:28px;border-radius:6px;background:var(--sl);display:flex;align-items:center;justify-content:center">${emo[c.cat]||'📚'}</div><div><div class="search-item-title">${c.name}</div><div class="search-item-sub">${c.level} · ${fmtMXN(c.price)}</div></div></div>`).join('')}</div>`;
  res.innerHTML=html;
}

function updateWizDots(){

  for(let i=1;i<=4;i++){

  }
  document.querySelectorAll('.wiz-pane').forEach((p,idx)=>p.classList.toggle('on',idx+1===s));
  if(s===4)setTimeout(renderWizSummary,30);
}
function wizGo(step){
  const current=APP.wizardStep;
  // Validate current step before leaving it
  if(current===1&&step>1){
    if(!APP.wizardData.tipo){showToast('Selecciona el tipo de proyecto','error');return;}
  }
  if(current===2&&step>2){
    const n=document.getElementById('wiz-name');
    if(!n?.value.trim()){showToast('Escribe el nombre del proyecto','error');n?.focus();n?.classList.add('invalid');return;}
    APP.wizardData.name=n.value.trim();
    const pr=document.getElementById('wiz-priority-val');
    if(pr)APP.wizardData.priority=pr.value;
  }
  if(current===3&&step>3){
    const d=document.getElementById('wiz-desc');
    if(!d?.value.trim()){showToast('Describe el objetivo del proyecto','error');d?.focus();d?.classList.add('invalid');return;}
    APP.wizardData.desc=d.value.trim();

function calcMinBudget(){
  const d=APP.wizardData;
  const weekMap={'1 semana':1,'2 semanas':2,'3 semanas':3,'4 semanas':4,'Más de 4 semanas':5};
  const weeks=weekMap[d.weeks]||2;
  const diffMap={basico:1,intermedio:1.4,avanzado:1.8};
  const diff=diffMap[d.difficulty]||1;
  const prioMap={normal:1,alta:1.15,urgente:1.3};
  const prio=prioMap[d.priority]||1;
  const base=3000;
  const weekMult=1+((weeks-1)*0.18);
  const min=Math.round(base*diff*weekMult*prio/500)*500;
  d.minBudget=min;
  if(d.budget<min)d.budget=min;
  const el=document.getElementById('min-bud-lbl');if(el)el.textContent=fmtMXN(min);
  const el2=document.getElementById('bud-lbl');if(el2)el2.textContent=fmtMXN(Math.max(d.budget,min));
  const el3=document.getElementById('range-min-lbl');if(el3)el3.textContent=fmtMXN(min)+' (mín)';
  const range=document.getElementById('wiz-budget-range');
  if(range){range.min=min;if(parseInt(range.value)<min)range.value=min;}
  const note=document.getElementById('min-bud-note');
  if(note){
    const parts=['Base $3,000'];
    if(diff>1)parts.push((diff===1.4?'+40%':'+80%')+' dificultad');
    if(weekMult>1)parts.push('+'+Math.round((weekMult-1)*100)+'% duración');
    if(prio>1)parts.push((prio===1.15?'+15%':'+30%')+' prioridad');
    note.textContent=parts.join(' · ');
  }
}

function sortTable(th){
  const col=th.dataset.sort;
  const tbody=th.closest('table').querySelector('tbody');
  const rows=Array.from(tbody.querySelectorAll('tr'));
  const dir=APP.sortState.col===col&&APP.sortState.dir==='asc'?'desc':'asc';
  APP.sortState={col,dir};
  th.closest('thead').querySelectorAll('th').forEach(h=>h.classList.remove('sort-asc','sort-desc'));
  th.classList.add('sort-'+dir);
  const ci=parseInt(th.dataset.colIdx||'0');
  rows.sort((a,b)=>{
    const av=a.dataset[col]||a.cells[ci]?.textContent.trim()||'';
    const bv=b.dataset[col]||b.cells[ci]?.textContent.trim()||'';
    const an=parseFloat(av.replace(/[^0-9.-]/g,''));
    const bn=parseFloat(bv.replace(/[^0-9.-]/g,''));
    if(!isNaN(an)&&!isNaN(bn))return dir==='asc'?an-bn:bn-an;
    return dir==='asc'?av.localeCompare(bv,'es'):bv.localeCompare(av,'es');
  });
  rows.forEach(r=>tbody.appendChild(r));
}

function getDashData(){
  const isYear=APP.dashFilter.period==='año';
  const year=APP.dashFilter.year||2025;
  const month=APP.dashFilter.month||'Abril';
  const yd=APP.monthlyData[year];
  if(!yd) return null;
  if(isYear){
    // Sum all months for that year
    const months=Object.keys(yd).filter(k=>k!=='annual');
    const d={mem:0,com:0,cur:0,rev:0,companies:0,projects:0,students:0,newCo:0,newSt:0};
    months.forEach(m=>{const md=yd[m];if(md){d.mem+=md.mem;d.com+=md.com;d.cur+=md.cur;d.rev+=md.rev;d.projects+=md.projects;d.newCo+=md.newCo;d.newSt+=md.newSt;}});
    d.companies=yd[months[months.length-1]]?.companies||0;
    d.students=yd[months[months.length-1]]?.students||0;
    return d;
  }
  return yd[month]||null;
}
function getPrevData(){
  const isYear=APP.dashFilter.period==='año';
  const year=APP.dashFilter.year||2025;
  const month=APP.dashFilter.month||'Abril';
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  if(isYear){
    const prevYear=year-1;
    if(!APP.monthlyData[prevYear]) return null;
    const yd=APP.monthlyData[prevYear];
    const keys=Object.keys(yd).filter(k=>k!=='annual');
    const d={mem:0,com:0,cur:0,rev:0,projects:0};
    keys.forEach(m=>{const md=yd[m];if(md){d.mem+=md.mem;d.com+=md.com;d.cur+=md.cur;d.rev+=md.rev;d.projects+=md.projects;}});
    return d;
  }
  const idx=months.indexOf(month);
  if(idx<=0){
    // Previous year December
    const yd=APP.monthlyData[year-1];
    return yd?yd['Diciembre']:null;
  }
  return APP.monthlyData[year]?.[months[idx-1]]||null;
}
function pct(curr,prev){
  if(!prev||prev===0) return null;
  const p=Math.round((curr-prev)/prev*100);
  return (p>=0?'+':'')+p+'%';
}
function refreshDashStats(){
  const isYear=APP.dashFilter.period==='año';
  const year=APP.dashFilter.year||2025;
  const month=document.getElementById('dash-month')?.value||APP.dashFilter.month||'Abril';
  const periodLabel=isYear?('Año '+year):(month+' '+year);
  const d=getDashData();
  if(!d)return;
  const prev=getPrevData();
  const tot=d.mem+d.com+d.cur;
  const prevTot=prev?prev.mem+prev.com+prev.cur:null;
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  const setC=(id,v,up)=>{const el=document.getElementById(id);if(el){el.textContent=v;el.className='stat-delta '+(up?'up':'');}};
  const dStr=(curr,prv)=>{if(!prv||prv===0)return'Periodo actual';const p=Math.round((curr-prv)/prv*100);return(curr>=prv?'↑ +':('↓ -'))+Math.abs(p)+'% vs anterior';};
  const isUp=(c,p)=>!p||c>=p;
  set('dash-tot-hero',fmtMXN(tot)+' — '+periodLabel);
  set('dash-hero-sub','Membresías '+fmtMXN(d.mem)+' · Comisiones '+fmtMXN(d.com)+' · Cursos '+fmtMXN(d.cur));
  set('dash-period-chip',periodLabel);
  set('dash-tot',fmtMXN(tot));
  setC('dash-tot-delta',prevTot?dStr(tot,prevTot):'Periodo actual',isUp(tot,prevTot));
  set('dash-mem',fmtMXN(d.mem));
  setC('dash-mem-delta',d.companies+' empresas · '+dStr(d.mem,prev?.mem),isUp(d.mem,prev?.mem));
  set('dash-proj',d.projects);
  setC('dash-proj-delta',d.projects+' proyectos '+dStr(d.projects,prev?.projects),isUp(d.projects,prev?.projects));
  set('dash-stud',d.students);
  setC('dash-stud-delta',d.students+' activos'+(d.newSt>0?' · +'+d.newSt+' nuevos':''),true);
  set('dash-com',fmtMXN(d.com));
  set('dash-com-sub','30% sobre '+fmtMXN(d.rev)+' en proyectos');
  set('kpi-match-rate',(d.matchRate||87)+'%');
  set('kpi-match-days',(d.matchDays||1.4)+'d');
  set('kpi-on-time',(d.onTime||91)+'%');
  set('kpi-avg-rating',(d.avgRating||4.8)+'★');
  set('kpi-rev-per-stud',fmtK(Math.round(tot/Math.max(d.students,1))));
}

function refreshRevStats(){
  const yr=APP.revFilter.year;
  const month=APP.revFilter.month;
  const isYear=APP.revFilter.period==='año';
  const yrData=APP.monthlyData[yr]||{};
  const mKeys=Object.keys(yrData);
  const mShort=mKeys.map(k=>k.slice(0,3));

  let d;
  if(isYear){
    d=mKeys.reduce((acc,m)=>{
      const md=yrData[m]||{};
      return{mem:acc.mem+(md.mem||0),com:acc.com+(md.com||0),cur:acc.cur+(md.cur||0),rev:acc.rev+(md.rev||0),companies:Math.max(acc.companies,md.companies||0),projects:acc.projects+(md.projects||0),students:Math.max(acc.students,md.students||0),matchRate:acc.matchRate+(md.matchRate||0)/_cnt,avgRating:acc.avgRating+(md.avgRating||0)/_cnt,matchDays:acc.matchDays+(md.matchDays||0)/_cnt,onTime:acc.onTime+(md.onTime||0)/_cnt};
    },{mem:0,com:0,cur:0,rev:0,companies:0,projects:0,students:0,matchRate:0,avgRating:0,matchDays:0,onTime:0});
    const _cnt=mKeys.length||1;
    d=mKeys.reduce((acc,m)=>{
      const md=yrData[m]||{};
      return{mem:(acc.mem||0)+(md.mem||0),com:(acc.com||0)+(md.com||0),cur:(acc.cur||0)+(md.cur||0),rev:(acc.rev||0)+(md.rev||0),companies:Math.max(acc.companies||0,md.companies||0),projects:(acc.projects||0)+(md.projects||0),students:Math.max(acc.students||0,md.students||0)};
    },{});
    d.matchRate=Math.round(mKeys.filter(m=>yrData[m].matchRate).reduce((a,m)=>a+(yrData[m].matchRate||0),0)/(mKeys.filter(m=>yrData[m].matchRate).length||1));
    d.avgRating=(mKeys.filter(m=>yrData[m].avgRating).reduce((a,m)=>a+(yrData[m].avgRating||0),0)/(mKeys.filter(m=>yrData[m].avgRating).length||1)).toFixed(1);
  } else {
    d=yrData[month]||{mem:0,com:0,cur:0,rev:0,companies:0,projects:0,students:0,matchRate:0,avgRating:0,matchDays:0,onTime:0};
  }

  const tot=(d.mem||0)+(d.com||0)+(d.cur||0);
  const curMonth=isYear?'Año '+yr:month;

  // Update stat cards
  const statEls={
    'rev-mem':fmtMXN(d.mem||0),
    'rev-com':fmtMXN(d.com||0),
    'rev-cur':fmtMXN(d.cur||0),
    'rev-tot':fmtMXN(tot),
    'rev-cos':String(d.companies||0),
    'rev-proj':String(d.projects||0),
    'rev-stu':String(d.students||0),
    'rev-match':(d.matchRate||0)+'%',
    'rev-rating':String(d.avgRating||0)+'★',
    'rev-days':String(d.matchDays||0)+' días',
    'rev-ontime':String(d.onTime||0)+'%',
  };
  Object.entries(statEls).forEach(([id,val])=>{const el=document.getElementById(id);if(el)el.textContent=val;});

  // Update all 4 gauges dynamically
  const sources=[
    {id:'gauge-mem',val:d.mem||0,meta:25000},
    {id:'gauge-com',val:d.com||0,meta:20000},
    {id:'gauge-cur',val:d.cur||0,meta:15000},
    {id:'gauge-tot',val:tot,meta:60000},
  ];
  sources.forEach(src=>{
    const pct=Math.min(100,Math.round(src.val/src.meta*100));
    const offset=Math.round(251*(1-pct/100));
    // Update arc
    const arc=document.getElementById(src.id+'-arc');
    if(arc)arc.setAttribute('stroke-dashoffset',offset);
    // Update pct text
    const pctEl=document.getElementById(src.id+'-pct');
    if(pctEl)pctEl.textContent=pct+'%';
    // Update amount
    const amtEl=document.getElementById(src.id+'-amt');
    if(amtEl)amtEl.textContent=fmtMXN(src.val);
    // Update status
    const stEl=document.getElementById(src.id+'-st');
    if(stEl){
      stEl.textContent=pct>=100?'✓ Meta alcanzada':pct>=70?'Buen ritmo':'Por debajo de meta';
      stEl.style.color=pct>=100?'var(--g3)':pct>=70?'var(--amb)':'var(--rose)';
    }
  });

  // Update histogram bars
  const mVals=mKeys.map(m=>yrData[m]?(yrData[m].mem+yrData[m].com+yrData[m].cur):0);
  const maxV=Math.max(...mVals,1);
  const BAR_MAX=80;
  mKeys.forEach((mk,i)=>{
    const bar=document.getElementById('revbar-'+i);
    const lbl=document.getElementById('revbar-lbl-'+i);
    if(bar){
      const v=mVals[i];
      const px=v?Math.max(4,Math.round(v/maxV*BAR_MAX)):0;
      const isActive=!isYear&&mk===month;
      bar.style.height=px+'px';
      bar.style.background=isActive?'var(--g3)':'var(--g5)';
      bar.style.opacity=isActive?'1':'0.55';
    }
    if(lbl){
      const isActive=!isYear&&mk===month;
      lbl.style.color=isActive?'var(--g3)':'var(--t3)';
      lbl.style.fontWeight=isActive?'700':'400';
    }
  });

function initSim(){
  const update=()=>{
    const companies=parseInt(document.getElementById('sim-companies')?.value||10);
    const revPerProj=parseInt(document.getElementById('sim-rev')?.value||7000);
    const projsPerCo=parseFloat(document.getElementById('sim-proj')?.value||1.5);
    const planMix=document.getElementById('sim-plan')?.value||'empresa';
    const coursesCount=parseInt(document.getElementById('sim-courses')?.value||5);
    const pricePerCourse=parseInt(document.getElementById('sim-cprice')?.value||1450);
    const studPerCourse=parseInt(document.getElementById('sim-cstud')?.value||12);
    const planPrice={basico:1200,empresa:2500,semestral:Math.round(12000/6),anual:Math.round(24000/12)}[planMix]||2500;
    const mem=companies*planPrice;
    const totalProjs=Math.round(companies*projsPerCo);
    const rev=totalProjs*revPerProj;
    const com=Math.round(rev*.3);
    const cur=Math.round(coursesCount*studPerCourse*pricePerCourse*.3);
    const tot=mem+com+cur;
    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
    set('sim-lbl-co',companies+' empresas');
    set('sim-lbl-rev',fmtMXN(revPerProj)+'/proyecto');
    set('sim-lbl-proj',projsPerCo+' proy/empresa');
    set('sim-lbl-cur',coursesCount+' cursos');
    set('sim-lbl-cprice',fmtMXN(pricePerCourse));
    set('sim-lbl-cstud',studPerCourse+' est/curso');
    set('sim-tot',fmtMXN(tot));
    set('sim-mem',fmtMXN(mem));
    set('sim-com',fmtMXN(com));
    set('sim-cur-out',fmtMXN(cur));
    set('sim-yr',fmtMXN(tot*12));
    set('sim-partner',fmtMXN(tot*12/2));
    // bars — use px not %
    const vals=[mem,com,cur];
    const maxV=Math.max(...vals,1);
    document.querySelectorAll('.sim-bar').forEach((b,i)=>{
      b.style.height=Math.max(4,Math.round(vals[i]/maxV*80))+'px';
    });
    // goal check
    const goal=parseInt(document.getElementById('sim-goal')?.value||0);
    const goalEl=document.getElementById('sim-goal-msg');
    if(goalEl&&goal>0){
      const diff=tot-goal;
      goalEl.textContent=diff>=0?'✓ Meta alcanzada — '+fmtMXN(diff)+' por encima':'Faltan '+fmtMXN(Math.abs(diff))+' para tu meta';
      goalEl.style.color=diff>=0?'var(--g3)':'var(--rose)';
    } else if(goalEl){goalEl.textContent='';}

    // ── Situación ACTUAL (Abril 2025) ──────────────────────────────
    const CUR={
      companies: APP.kpis.companies,           // 4
      planPrice: 2500,                          // Plan Empresa actual
      planMix:  'empresa',
      projsPerCo: parseFloat((APP.kpis.revenue / Math.max(APP.kpis.companies,1) / 7000).toFixed(1)),
      revPerProj: 7000,
      coursesCount: APP.courses.length,         // 8
      studPerCourse: Math.round(APP.courses.reduce((a,c)=>a+c.enrolled,0)/Math.max(APP.courses.length,1)),
      pricePerCourse: Math.round(APP.courses.reduce((a,c)=>a+c.price,0)/Math.max(APP.courses.length,1)),
    };
    const curMem  = CUR.companies * CUR.planPrice;
    const curCom  = Math.round(CUR.companies * CUR.projsPerCo * CUR.revPerProj * 0.3);
    const curCur  = Math.round(CUR.coursesCount * CUR.studPerCourse * CUR.pricePerCourse * 0.3);
    const curTot  = curMem + curCom + curCur;

    // ── Situación SIMULADA ──────────────────────────────────────
    // (ya calculada: mem, com, cur, tot, companies, projsPerCo, etc.)

    const recs = [];
    const diff_tot  = tot - curTot;
    const pct_tot   = curTot > 0 ? Math.round(diff_tot / curTot * 100) : 0;

    // Helper: arrow tag
    const arrow = (simVal, curVal) => simVal > curVal
      ? '<span style="color:var(--g3);font-weight:700">↑</span>'
      : simVal < curVal
      ? '<span style="color:var(--rose);font-weight:700">↓</span>'
      : '<span style="color:var(--t3)">→</span>';

    // ── 1. RESUMEN DE BRECHA ─────────────────────────────────────
    if(Math.abs(diff_tot) < 500){
      recs.push({icon:'check',col:'var(--g3)',impact:'info',
        title:'El escenario simulado es muy similar al actual',
        body:'Ingreso actual: '+fmtMXN(curTot)+'/mes · Simulado: '+fmtMXN(tot)+'/mes. Mueve los sliders para explorar escenarios distintos y ver qué palancas tienen mayor impacto.'
      });
    } else {
      const verb = diff_tot > 0 ? 'ganarías' : 'perderías';
      const col  = diff_tot > 0 ? 'var(--g3)' : 'var(--rose)';
      recs.push({icon:'trend',col:col,impact:diff_tot>0?'alto':'urgente',
        title:(diff_tot>0?'↑ ':'↓ ')+fmtMXN(Math.abs(diff_tot))+'/mes más que hoy ('+Math.abs(pct_tot)+'%)',
        body:'Situación actual: '+fmtMXN(curTot)+'/mes → Escenario simulado: '+fmtMXN(tot)+'/mes. '
          +(diff_tot>0
            ? 'Eso equivale a '+fmtMXN(diff_tot*12)+' adicionales al año y '+fmtMXN(diff_tot*12/2)+' por socio.'
            : 'Revisar los sliders: este escenario reduce ingresos vs la situación actual.')
      });
    }

    // ── 2. EMPRESAS ──────────────────────────────────────────────
    const diffCo = companies - CUR.companies;
    if(diffCo !== 0){
      const gainMem = Math.abs(diffCo) * planPrice;
      recs.push({icon:'bolt',col:diffCo>0?'var(--g3)':'var(--rose)',impact:diffCo>0?'alto':'urgente',
        title:arrow(companies,CUR.companies)+' Empresas: '+CUR.companies+' → '+companies+(diffCo>0?' (+'+diffCo+')':' ('+diffCo+')'),
        body: diffCo > 0
          ? 'Necesitas conseguir '+diffCo+' empresa'+(diffCo>1?'s':'')+' nueva'+(diffCo>1?'s':'')+' en plan '+planMix+'. Eso aporta '+fmtMXN(gainMem)+'/mes solo en membresías. Canales recomendados: referidos de clientes actuales, LinkedIn outreach, alianzas con cámaras empresariales.'
          : 'Este escenario implica perder '+Math.abs(diffCo)+' empresa'+(Math.abs(diffCo)>1?'s':'')+'. Eso reduce membresías en '+fmtMXN(gainMem)+'/mes. Para evitarlo: programa revisiones trimestrales con cada cliente y ofrece incentivos de renovación anticipada.'
      });
    }

    // ── 3. PLAN ──────────────────────────────────────────────────
    const planLabels = {basico:'Básico ($1,200)',empresa:'Empresa ($2,500)',semestral:'Semestral ($2,000/mes)',anual:'Anual ($2,000/mes)'};
    if(planMix !== CUR.planMix){
      const diffPlan = planPrice - CUR.planPrice;
      recs.push({icon:'star',col:diffPlan>=0?'var(--g3)':'var(--rose)',impact:diffPlan>0?'alto':'urgente',
        title:arrow(planPrice,CUR.planPrice)+' Plan: '+planLabels[CUR.planMix]+' → '+planLabels[planMix],
        body: diffPlan > 0
          ? 'Migrar tus '+companies+' empresas actuales al plan '+planMix+' genera '+fmtMXN(diffPlan*companies)+'/mes extra en membresías. Pitch sugerido: "acceso ilimitado, soporte prioritario y garantía de SLA en 24h". Considera ofrecer 1 mes gratis al migrar.'
          : 'Bajar de plan reduce ingresos de membresía en '+fmtMXN(Math.abs(diffPlan)*companies)+'/mes. Solo justificado si el objetivo es retener empresas en riesgo de cancelar.'
      });
    }

    // ── 4. PROYECTOS POR EMPRESA ─────────────────────────────────
    const diffPPco = Math.round((projsPerCo - CUR.projsPerCo)*10)/10;
    if(Math.abs(diffPPco) >= 0.5){
      const gainCom = Math.round(Math.abs(diffPPco) * companies * revPerProj * 0.3);
      recs.push({icon:'folder',col:diffPPco>0?'var(--amb)':'var(--rose)',impact:diffPPco>0?'alto':'urgente',
        title:arrow(projsPerCo,CUR.projsPerCo)+' Proyectos/empresa: '+CUR.projsPerCo+' → '+projsPerCo,
        body: diffPPco > 0
          ? 'Para pasar de '+CUR.projsPerCo+' a '+projsPerCo+' proyectos/empresa necesitas generar ~'+Math.round(diffPPco*companies)+' proyectos más al mes. Táctica: asigna a cada empresa un "project manager Nexus" que proponga iniciativas trimestrales. Impacto en comisiones: +'+fmtMXN(gainCom)+'/mes.'
          : 'Menos proyectos por empresa reducen comisiones en '+fmtMXN(gainCom)+'/mes. Riesgo: si las empresas publican menos proyectos, también pierden valor percibido de la membresía.'
      });
    }

    // ── 5. TICKET PROMEDIO POR PROYECTO ─────────────────────────
    const diffRev = revPerProj - CUR.revPerProj;
    if(Math.abs(diffRev) >= 500){
      const gainPerTicket = Math.round(Math.abs(diffRev) * totalProjs * 0.3);
      recs.push({icon:'dollar',col:diffRev>0?'var(--g3)':'var(--rose)',impact:diffRev>0?'medio':'urgente',
        title:arrow(revPerProj,CUR.revPerProj)+' Ticket proyecto: '+fmtMXN(CUR.revPerProj)+' → '+fmtMXN(revPerProj),
        body: diffRev > 0
          ? 'Para subir de '+fmtMXN(CUR.revPerProj)+' a '+fmtMXN(revPerProj)+'/proyecto: enfoca el catálogo en proyectos de mayor alcance (modelos financieros multicapa, due diligence, planes de negocio completos). Define paquetes "Pro" con entregables más robustos. Impacto con '+totalProjs+' proyectos: +'+fmtMXN(gainPerTicket)+'/mes en comisiones.'
          : 'Bajar el ticket promedio reduce comisiones en '+fmtMXN(gainPerTicket)+'/mes. Solo viable si la estrategia es aumentar volumen de proyectos para compensar.'
      });
    }

    // ── 6. CURSOS ────────────────────────────────────────────────
    const diffCurCount = coursesCount - CUR.coursesCount;
    const diffStud     = studPerCourse - CUR.studPerCourse;
    const diffPrice    = pricePerCourse - CUR.pricePerCourse;
    const curCurSim    = cur; // already computed

    if(Math.abs(curCurSim - curCur) >= 300){
      let curSteps = [];
      if(diffCurCount > 0) curSteps.push('lanzar '+diffCurCount+' curso'+(diffCurCount>1?'s':'')+' nuevo'+(diffCurCount>1?'s':''));
      if(diffCurCount < 0) curSteps.push('reducir a '+coursesCount+' cursos activos');
      if(diffStud > 0)     curSteps.push('llenar '+diffStud+' lugar'+(diffStud>1?'es':'')+' más por curso (de '+CUR.studPerCourse+' a '+studPerCourse+' est)');
      if(diffStud < 0)     curSteps.push('operar con '+studPerCourse+' estudiantes/curso en promedio');
      if(diffPrice > 0)    curSteps.push('subir precio de '+fmtMXN(CUR.pricePerCourse)+' a '+fmtMXN(pricePerCourse)+' por curso');
      if(diffPrice < 0)    curSteps.push('bajar precio a '+fmtMXN(pricePerCourse)+'/curso');
      const gainCur = curCurSim - curCur;
      recs.push({icon:'book',col:gainCur>=0?'var(--amb)':'var(--rose)',impact:gainCur>0?'medio':'urgente',
        title:arrow(curCurSim,curCur)+' Ingresos cursos: '+fmtMXN(curCur)+' → '+fmtMXN(curCurSim)+'/mes',
        body:'Para llegar a este escenario necesitas: '+curSteps.join(', ')+'. '
          +(gainCur>0
            ? 'Palanca más rápida: promocionar cursos en vivo (Zoom + agenda semanal) en LinkedIn y grupos de WhatsApp de exalumnos.'
            : 'Reducir cursos libera tiempo del equipo pero baja ingresos. Asegúrate de que el ahorro operativo justifique la pérdida de '+fmtMXN(Math.abs(gainCur))+'/mes.')
      });
    }

    // ── 7. META ──────────────────────────────────────────────────
    const goalV = parseInt(document.getElementById('sim-goal')?.value||0);
    if(goalV > 0){
      const gapToGoal = goalV - tot;
      if(gapToGoal > 0){
        const coExtra   = Math.ceil(gapToGoal / planPrice);
        const projExtra = Math.ceil(gapToGoal / (revPerProj * 0.3));
        const curExtra  = Math.ceil(gapToGoal / (studPerCourse * pricePerCourse * 0.3));
        recs.push({icon:'sim',col:'var(--rose)',impact:'urgente',
          title:'Faltan '+fmtMXN(gapToGoal)+' para tu meta de '+fmtMXN(goalV)+'/mes',
          body:'Desde el escenario simulado ('+fmtMXN(tot)+'/mes) necesitas cerrar esa brecha. Opciones: '
            +'A) +'+coExtra+' empresa'+(coExtra>1?'s':'')+' en plan '+planMix+' (+'+fmtMXN(coExtra*planPrice)+'/mes). '
            +'B) +'+projExtra+' proyecto'+(projExtra>1?'s':'')+' más/mes (+'+fmtMXN(projExtra*revPerProj*.3)+' en comisiones). '
            +'C) +'+curExtra+' curso'+(curExtra>1?'s':'')+' adicional'+(curExtra>1?'es':'')+' llenos (+'+fmtMXN(curExtra*studPerCourse*pricePerCourse*.3)+'/mes).'
        });
      } else {
        recs.push({icon:'check',col:'var(--g3)',impact:'info',
          title:'✓ Meta de '+fmtMXN(goalV)+' alcanzada en el escenario simulado',
          body:'El escenario simulado ('+fmtMXN(tot)+'/mes) supera tu meta por '+fmtMXN(Math.abs(gapToGoal))+'. Ahora el objetivo es ejecutar los pasos descritos arriba para pasar de la situación actual ('+fmtMXN(curTot)+'/mes) a este escenario.'
        });
      }
    }

    // ── Render ───────────────────────────────────────────────────
    const recEl=document.getElementById('sim-recs');
    if(!recEl)return;
    const impactColor={alto:'var(--g3)',medio:'var(--amb)',bajo:'var(--t3)',urgente:'var(--rose)',info:'var(--ind)'};
    const impactLabel={alto:'Alto impacto',medio:'Impacto medio',bajo:'Mantenimiento',urgente:'Acción urgente',info:'Info'};
    recEl.innerHTML=recs.map(r=>`
      <div style="display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--sb)">
        <div style="width:30px;height:30px;border-radius:50%;background:${r.col}20;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">
          ${ic(r.icon,14,r.col)}
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap">
            <div style="font-size:13px;font-weight:700">${r.title}</div>
            <span style="font-size:10px;font-weight:700;color:${impactColor[r.impact]};text-transform:uppercase;letter-spacing:.5px;flex-shrink:0">${impactLabel[r.impact]}</span>
          </div>
          <div style="font-size:12px;color:var(--t2);line-height:1.65">${r.body}</div>
        </div>
      </div>`).join('');
  };
  ['sim-companies','sim-rev','sim-proj','sim-plan','sim-courses','sim-cprice','sim-cstud'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('input',update);
    if(el&&el.tagName==='SELECT')el.addEventListener('change',update);
  });
  const goalEl=document.getElementById('sim-goal');
  if(goalEl)goalEl.addEventListener('input',update);
  update();
}

function toggleChatbot(){
  const win=document.getElementById('chatbot-win');
  win.classList.toggle('open');
  if(win.classList.contains('open')&&!document.getElementById('chatbot-msgs').children.length){
    addBotMsg('¡Hola! Soy el asistente de Nexus. ¿En qué puedo ayudarte hoy? Puedo responder preguntas sobre proyectos, cursos, pagos y más.');
  }
}
function addBotMsg(text){
  const msgs=document.getElementById('chatbot-msgs');
  const div=document.createElement('div');
  div.className='msg msg-other';
  div.innerHTML=`<div class="msg-name">Nexus Bot</div><div class="msg-bubble" style="background:var(--wh);border:1px solid var(--sb);color:var(--txt)">${text}</div>`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}
function addUserMsg(text){
  const msgs=document.getElementById('chatbot-msgs');
  const div=document.createElement('div');
  div.className='msg msg-me';
  div.innerHTML=`<div class="msg-bubble">${text}</div>`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}
function sendChatbot(){
  const inp=document.getElementById('chatbot-inp');
  if(!inp?.value.trim())return;
  const q=inp.value.trim();addUserMsg(q);inp.value='';
  const ql=q.toLowerCase();
  setTimeout(()=>{
    let resp='';
    if(ql.includes('proyecto')||ql.includes('proyecto'))resp=`Actualmente tienes ${APP.projects.filter(p=>p.status==='active').length} proyectos activos y ${APP.projects.filter(p=>p.status==='nomatch').length} sin asignar. ¿Quieres más detalles de alguno?`;
    else if(ql.includes('pago')||ql.includes('factura'))resp='Los pagos se procesan automáticamente según tu membresía. Puedes ver el historial completo en la sección de Pagos.';
    else if(ql.includes('curso'))resp=`Tenemos ${APP.courses.length} cursos disponibles, ${APP.courses.filter(c=>c.live).length} en vivo y ${APP.courses.filter(c=>!c.live).length} grabados. Los precios van de ${fmtMXN(1050)} a ${fmtMXN(1950)}.`;
    else if(ql.includes('estudiante')||ql.includes('consultor'))resp=`Contamos con ${APP.students.filter(s=>s.available&&s.status!=='inactive').length} estudiantes disponibles en este momento. Puedes verlos en la sección de Talento.`;
    else if(ql.includes('membresía')||ql.includes('plan'))resp='Ofrecemos Plan Básico ($1,200/mes), Plan Empresa ($2,500/mes), Plan Semestral ($12,000) y Plan Anual ($24,000). ¿Quieres comparar los planes?';
    else if(ql.includes('match'))resp='El matching considera el área de estudio, habilidades del estudiante y el rating. La empresa siempre tiene la decisión final sobre qué estudiante seleccionar.';
    else if(ql.includes('hola')||ql.includes('hi'))resp='¡Hola! ¿En qué puedo ayudarte?';
    else resp='Entiendo tu pregunta. Para más detalles específicos, te recomiendo revisar la sección correspondiente en el panel o contactar a tu gestor de cuenta.';
    addBotMsg(resp);
  },700+Math.random()*500);
}

function setTab(btn,idx,max){
  btn.closest('.tab-bar').querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  for(let i=0;i<max;i++){const p=document.getElementById('tab-'+i);if(p)p.className='tab-pane'+(i===idx?' on':'');}
}

      ${isDone?btn(ic('file',12)+' Exportar reporte','btn-sec btn-sm',false,"showToast('Descargando reporte...','info')"):''}
    </div>
  </div>`;
}).join('')}

${!filtered.length&&APP.projFilter!=='all'?'':`
<!-- Bottom CTA -->
<div style="text-align:center;padding:20px 0">

                ${skillMatches.map(sk=>`<span style="font-size:10px;padding:2px 8px;border-radius:10px;background:var(--g-ll);color:var(--g1);font-weight:600;border:1px solid var(--g-l)">✓ ${sk}</span>`).join('')}
                <span style="font-size:10px;padding:2px 8px;border-radius:10px;background:var(--amb-l);color:var(--amb-d);font-weight:600">★ ${avgRating}</span>

      }).join('')}
    </div>
    <div style="height:1px;background:var(--sb);margin-top:20px"></div>
  </div>`;
}).join('')}

${matched.length?`
  ${shdr('Proyectos con consultor ya asignado')}

    ${matched.map(p=>{
      const s=APP.students.find(x=>x.id===p.selectedStudent);
      return`<div class="card card-hover card-g" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px" onclick="openProjectModal(${p.id})">
        <div>
          <div class="ct">${p.name}</div>
          <div class="cs">${p.type} · Entrega ${p.delivery}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          ${s?`<div style="display:flex;align-items:center;gap:7px">${ava(s.init,s.cls,28)}<span class="cs">${s.name}</span></div>`:''}

${waiting.length?`

    ${waiting.map(p=>`
      <div class="card card-r" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">

function confirmSelectConsultant(projId,studId){
  const p=APP.projects.find(x=>x.id===projId);
  const s=APP.students.find(x=>x.id===studId);
  if(!p||!s)return;
  confirmAction(
    '¿Seleccionar a '+s.name+'?',
    'El consultor será notificado y el proyecto pasará a estado activo. Esta acción no se puede deshacer.',
    ()=>{
      p.selectedStudent=studId;
      p.consultant=s.name;
      p.ci=s.init;
      p.cc=s.cls;
      p.status='active';
      p.pct=0;
      p.startDate=new Date().toLocaleDateString('es-MX',{day:'numeric',month:'short'});
      APP.notifications.unshift({
        id:Date.now(),read:false,type:'success',
        title:'Consultor seleccionado',
        text:s.name+' asignado a "'+p.name+'"',
        time:'Ahora',icon:'check',target:'emp/proj'
      });
      showToast('¡'+s.name+' seleccionado! El proyecto ahora está activo.','success');
      goTab('emp','match');
    }
  );
}

SCREENS.emp.pay=()=>{

  <select class="field" style="width:auto" onchange="document.querySelectorAll('.pay-row').forEach(r=>{r.style.display=this.value===''||r.dataset.type===this.value?'':'none'})">

    <option value="mem">Membresía</option><option value="com">Proyecto</option>
  </select>
</div>
<div class="stat-grid sg2" style="margin-bottom:18px">
  <div class="stat-card"><div class="stat-ico si-g">${ic('check',16,'var(--g3)')}</div><div class="stat-val">${fmtMXN(doneTotal)}</div><div class="stat-lbl">Proyectos liquidados</div><div class="stat-delta">${done.length} completados</div></div>
  <div class="stat-card"><div class="stat-ico si-a">${ic('alert',16,'var(--amb)')}</div><div class="stat-val">${fmtMXN(pendingTotal)}</div><div class="stat-lbl">Pendiente de liquidar</div><div class="stat-delta">${inReview.length} en revisión · ${inActive.length} activos</div></div>
</div>

${[...inReview,...inActive].length?`
<div class="card" style="margin-bottom:18px;border:2px solid var(--amb)">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">${ic('alert',16,'var(--amb)')}<div style="font-size:14px;font-weight:700">Proyectos con pago pendiente</div></div>
  ${[...inReview,...inActive].map(p=>{
    const canRelease=p.status==='review';
    const consultor=APP.students.find(s=>s.id===p.consultantId);
    return`<div style="border:1px solid var(--sb);border-radius:var(--rs);padding:14px;margin-bottom:10px;background:${canRelease?'var(--g-ll)':'var(--wh)'}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px">
        <div><div style="font-weight:700;margin-bottom:2px">${p.name}</div><div class="cs">${p.type} · ${p.area} · Entrega: ${p.delivery}</div>
          ${consultor?`<div style="display:flex;align-items:center;gap:6px;margin-top:5px">${ava(consultor.init,consultor.cls,22)}<span class="cs">${consultor.name}</span></div>`:''}
        </div>
        <div style="text-align:right">
          <div style="font-size:20px;font-weight:800;color:${canRelease?'var(--g3)':'var(--amb)'};font-family:'JetBrains Mono',monospace">${fmtMXN(p.cost)}</div>
          <div>${sbdg(p.status)}</div>
        </div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${canRelease?`${btn('✓ Aprobar y liberar '+fmtMXN(p.cost),'btn-g',false,`approveAndPay(${p.id})`)}${btn('Solicitar cambios','btn-sec btn-sm',false,`requestRevision(${p.id})`)}`:
        `<div style="font-size:12px;color:var(--t3);padding:8px 0">⏳ El pago se liberará cuando el proyecto sea aprobado</div>`}
        ${btn(ic('eye',13)+' Ver detalle','btn-ghost btn-sm',false,`openProjectModal(${p.id})`)}
      </div>
    </div>`;}).join('')}
</div>`:''}

<div class="tw">
  <table><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th>Monto</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
    ${[
      {date:'18 abr 2025',period:'Abril 2025',c:'Membresía Empresa — Abril 2025',type:'mem',a:2500,s:'be'},
      {date:'10 mar 2025',period:'Marzo 2025',c:'Liquidación — Benchmark precios Q1',type:'com',a:7200,s:'be'},
      {date:'18 mar 2025',period:'Marzo 2025',c:'Membresía Empresa — Marzo 2025',type:'mem',a:2500,s:'be'},
      {date:'18 feb 2025',period:'Febrero 2025',c:'Membresía Empresa — Febrero 2025',type:'mem',a:2500,s:'be'},
    ].map(r=>`<tr class="pay-row" data-period="${r.period}" data-type="${r.type}">
      <td>${r.date}</td><td style="font-weight:500">${r.c}</td>
      <td>${bdg(r.type==='mem'?'be':'ba',r.type==='mem'?'Membresía':'Proyecto')}</td>
      <td class="mono" style="font-weight:700">${fmtMXN(r.a)}</td>
      <td>${bdg(r.s,'Pagado')}</td>
      <td>${btn(ic('file',12)+' Recibo','btn-sm btn-ghost',false,"showToast('Descargando recibo...','info')")}</td>
    </tr>`).join('')}
  </tbody></table>
</div>`;
};
function approveAndPay(id){
  const p=APP.projects.find(x=>x.id===id);if(!p)return;
  confirmAction('¿Aprobar y liberar '+fmtMXN(p.cost)+'?','El consultor recibirá su pago y el proyecto se marcará como completado.',()=>{
    p.status='done';p.pct=100;
    APP.notifications.unshift({id:Date.now(),read:false,type:'success',title:'Pago liberado',text:fmtMXN(p.cost)+' — '+p.name,time:'Ahora',icon:'dollar',target:'emp/pay'});
    showToast('Pago de '+fmtMXN(p.cost)+' liberado exitosamente','success');
    goTab('emp','pay');
  });
}

    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--wh);border:1px solid var(--sb);border-radius:var(--r) var(--r) 0 0">
      <div style="width:36px;height:36px;border-radius:9px;background:var(--bk3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:'JetBrains Mono',monospace;flex-shrink:0">

    <div class="chat-wrap" id="est-chat-area" style="border-radius:0;border-top:none;border-bottom:none;height:300px"></div>

function switchEstChat(idx){
  APP.activeEstChat=idx;
  document.querySelectorAll('.conv-item').forEach((el,i)=>{
    el.classList.toggle('card-g',i===idx);
    el.style.border=i===idx?'2px solid var(--g3)':'2px solid var(--sb)';
  });
  renderEstChat();
  renderEstChatFiles();
}

function renderEstChat(){
  const conv=APP.chatConversations[APP.activeEstChat??0];
  if(!conv)return;
  const area=document.getElementById('est-chat-area');
  if(!area)return;
  const fileColors={xlsx:'var(--g3)',pdf:'var(--rose)',pptx:'var(--ind)',pbix:'var(--amb)',default:'var(--t2)'};
  // Render from student's perspective: 'consultant' = me, 'me' (company) = them
  area.innerHTML=conv.messages.map(m=>{
    const isMe=m.from==='consultant'; // student is the consultant
    const isFile=m.from==='file';
    if(isFile){
      const col=fileColors[m.fileType]||fileColors.default;
      return`<div class="msg ${isMe?'msg-me':'msg-other'}">
        ${!isMe?`<div class="msg-name">${conv.name}</div>`:''}
        <div class="msg-bubble" style="background:var(--sl);border:1px solid var(--sb);color:var(--txt);display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer" onclick="showToast('Descargando ${m.fileName}...','info')">
          ${ic('file',18,col)}
          <div><div style="font-weight:600;font-size:13px">${m.fileName}</div><div class="cs2">${m.fileSize}</div></div>
          <div style="margin-left:auto">${ic('link',14,'var(--g3)')}</div>
        </div>
        <div class="msg-time">${m.time}</div>
      </div>`;
    }
    return`<div class="msg ${isMe?'msg-me':'msg-other'}">
      ${!isMe?`<div class="msg-name">${conv.name}</div>`:''}
      <div class="msg-bubble">${m.text}</div>
      <div class="msg-time">${m.time}</div>
    </div>`;
  }).join('');
  area.scrollTop=area.scrollHeight;
}

function renderEstChatFiles(){
  const conv=APP.chatConversations[APP.activeEstChat??0];
  const list=document.getElementById('est-chat-files-list');
  if(!list||!conv)return;
  const files=conv.files||[];
  const fileColors={xlsx:'var(--g3)',pdf:'var(--rose)',pptx:'var(--ind)',pbix:'var(--amb)',default:'var(--t2)'};
  const fileBgs={xlsx:'var(--g-ll)',pdf:'var(--rose-l)',pptx:'var(--ind-ll)',pbix:'var(--amb-l)',default:'var(--wh3)'};
  if(!files.length){list.innerHTML='<div class="cs2" style="text-align:center;padding:12px">Sin archivos compartidos</div>';return;}
  list.innerHTML=files.map(f=>{
    const col=fileColors[f.type]||fileColors.default;
    const bg=fileBgs[f.type]||fileBgs.default;
    return`<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rs);background:${bg};margin-bottom:6px;cursor:pointer" onclick="showToast('Descargando ${f.name}...','info')">
      <div style="width:34px;height:34px;border-radius:6px;background:var(--wh);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--sh)">${ic('file',18,col)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</div>
        <div class="cs2">${f.date} · ${f.size}</div>
      </div>
      ${btn(ic('link',12),'btn-sm btn-ghost')}
    </div>`;
  }).join('');
}

function toggleEstChatFiles(){
  const panel=document.getElementById('est-chat-files-panel');
  if(panel){panel.style.display=panel.style.display==='none'?'block':'none';renderEstChatFiles();}
}

function sendEstMsg(){
  const inp=document.getElementById('est-chat-in');
  if(!inp||!inp.value.trim())return;
  const conv=APP.chatConversations[APP.activeEstChat??0];
  if(!conv)return;
  conv.messages.push({from:'consultant',name:'Tú',text:inp.value.trim(),time:'Ahora'});
  inp.value='';
  renderEstChat();
  // Simulate company reply
  const typing=document.getElementById('est-chat-typing');
  if(typing){typing.innerHTML='<span class="cs2">'+conv.name+' está escribiendo <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></span>';}
  setTimeout(()=>{
    conv.messages.push({from:'me',name:conv.name,text:'Gracias, lo revisamos y te confirmamos.',time:'Ahora'});
    if(typing)typing.innerHTML='';
    renderEstChat();
  },2000);
}

function openRatingDetail(){
  const s=APP.students[0];
  const avg=(s.ratings.reduce((a,b)=>a+b,0)/s.ratings.length).toFixed(1);
  const dist=[5,4,3,2,1].map(r=>({r,count:s.ratings.filter(x=>x===r).length}));
  const maxCount=Math.max(...dist.map(x=>x.count),1);
  const reviewsByRating=s.reviews.reduce((acc,rev)=>{acc[rev.r]=(acc[rev.r]||[]).concat(rev);return acc;},{});
  openModal('Desglose de calificaciones — '+s.name,`
    <div style="text-align:center;padding:20px 0;border-bottom:1px solid var(--sb);margin-bottom:18px">

      <div style="display:flex;gap:3px;justify-content:center;margin-top:10px">
        ${[1,2,3,4,5].map(i=>`<span style="font-size:26px;color:${i<=Math.round(avg)?'#F59E0B':'#e5e5e5'}">★</span>`).join('')}

    </div>
    <div style="margin-bottom:18px">
      <div style="font-size:12px;font-weight:600;color:var(--t2);margin-bottom:10px">Click en una barra para ver las reseñas de esa calificación</div>
      ${dist.map(({r,count})=>{
        const pct=s.ratings.length?Math.round(count/s.ratings.length*100):0;
        const px=count?Math.max(8,Math.round(count/maxCount*180)):0;
        const hasReviews=(reviewsByRating[r]||[]).length>0;
        return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="color:#F59E0B;font-weight:700;font-size:14px;width:26px;flex-shrink:0">${r}★</span>
          <div style="flex:1;height:30px;background:#f5f5f5;border-radius:5px;overflow:hidden;cursor:${hasReviews?'pointer':'default'};position:relative"
            ${hasReviews?`onclick="filterRatingReviews(${r})"`:''}>
            <div style="height:100%;width:${px}px;max-width:100%;background:${r>=4?'#F59E0B':r===3?'var(--amb)':'var(--rose)'};border-radius:5px"></div>
            ${pct>12?`<span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;color:${px>60?'#fff':r>=4?'#F59E0B':'var(--rose)'}">${pct}%</span>`:''}
          </div>
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;width:22px;text-align:right">${count}</span>
          ${hasReviews?`<button onclick="filterRatingReviews(${r})" style="font-size:10px;color:var(--g3);background:var(--g-ll);border:1px solid var(--g4);border-radius:10px;padding:2px 8px;cursor:pointer;font-family:inherit;white-space:nowrap">Ver ${(reviewsByRating[r]||[]).length}</button>`:`<span style="width:38px"></span>`}
        </div>`;
      }).join('')}
    </div>
    <div id="rating-reviews-filtered">
      <div style="font-size:12px;font-weight:600;color:var(--t2);margin-bottom:10px">Todas las reseñas</div>
      ${s.reviews.map(rev=>`
        <div style="border:1px solid var(--sb);border-radius:var(--rs);padding:12px;margin-bottom:8px;cursor:pointer" onclick="this.querySelector('.rvtxt').style.display=this.querySelector('.rvtxt').style.display==='none'?'block':'none'">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
            <div style="font-weight:600;font-size:13px">${rev.company}</div>

        </div>`).join('')}
    </div>
