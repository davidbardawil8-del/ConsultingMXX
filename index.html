<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroConsulting MX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ind:#4F46E5;--ind-l:#818CF8;--ind-ll:#EEF2FF;--ind-d:#3730A3;--ind-xl:#E0E7FF;
  --eme:#059669;--eme-l:#D1FAE5;--eme-d:#065F46;
  --amb:#D97706;--amb-l:#FEF3C7;--amb-d:#92400E;
  --rose:#E11D48;--rose-l:#FFE4E6;--rose-d:#9F1239;
  --sl:#F8FAFC;--sm:#F1F5F9;--sb:#E2E8F0;--sb2:#CBD5E1;
  --txt:#0F172A;--t2:#475569;--t3:#94A3B8;--t4:#CBD5E1;
  --white:#FFFFFF;--r:12px;--rs:8px;--rl:16px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.08);--sh-lg:0 12px 32px rgba(0,0,0,.12);
  --sidebar-w:230px;--bg:#EEF0F6;
  --tr:all .18s ease;
}
html,body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px;line-height:1.5}
body.dark{--sl:#1E293B;--sm:#0F172A;--sb:#334155;--sb2:#475569;--txt:#F1F5F9;--t2:#94A3B8;--t3:#64748B;--t4:#334155;--white:#1E293B;--bg:#0F172A;--ind-ll:#1e1b4b;--eme-l:#064e3b;--amb-l:#451a03;--rose-l:#4c0519}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--white);border-right:1px solid var(--sb);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;transition:width .2s ease}
.sidebar.collapsed{width:56px}
.sidebar.collapsed .s-name,.sidebar.collapsed .nav-lbl,.sidebar.collapsed .s-section-lbl,.sidebar.collapsed .u-info,.sidebar.collapsed .sidebar-quick-inner{display:none}
.sidebar.collapsed .nav-btn{justify-content:center;padding:9px}
.sidebar.collapsed .s-brand{justify-content:center;padding:16px 0}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .2s ease}
.main.expanded{margin-left:56px}
.s-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid var(--sb)}
.s-logo{width:32px;height:32px;border-radius:9px;background:var(--ind);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s-logo svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-name{font-size:14px;font-weight:600;color:var(--txt);letter-spacing:-.3px;white-space:nowrap}
.s-name b{color:var(--ind)}
.s-section{padding:10px 10px 6px}
.s-section-lbl{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;padding:0 6px 6px;display:block}
.nav-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--rs);font-size:13px;font-weight:400;color:var(--t2);background:none;border:none;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;position:relative;transition:var(--tr);white-space:nowrap;overflow:hidden}
.nav-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.7}
.nav-btn:hover{background:var(--sm);color:var(--txt)}
.nav-btn.on{background:var(--ind-ll);color:var(--ind-d);font-weight:500}
.nav-btn.on svg{stroke:var(--ind);opacity:1}
.nav-btn .bdot{position:absolute;right:10px;width:18px;height:18px;border-radius:50%;background:var(--rose);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.s-divider{height:1px;background:var(--sb);margin:4px 10px}
.s-user{padding:10px;border-top:1px solid var(--sb);margin-top:auto}
.s-user-inner{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;transition:var(--tr)}
.s-user-inner:hover{background:var(--sm)}
.u-ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:'DM Mono',monospace}
.u-info{flex:1;min-width:0}
.ap{background:var(--ind-ll);color:var(--ind-d)}.ae{background:var(--eme-l);color:var(--eme-d)}.aa{background:var(--amb-l);color:var(--amb-d)}.ar{background:var(--rose-l);color:var(--rose-d)}.ab{background:var(--sb);color:var(--t2)}.bg2{background:var(--sm);color:var(--t2)}
.u-name{font-size:12px;font-weight:500;color:var(--txt)}
.u-role{font-size:11px;color:var(--t3)}
.topbar{background:var(--white);border-bottom:1px solid var(--sb);padding:0 24px;display:flex;align-items:center;height:52px;position:sticky;top:0;z-index:90;gap:8px}
.tb-toggle{width:30px;height:30px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;color:var(--t2);flex-shrink:0;transition:var(--tr)}
.tb-toggle:hover{background:var(--sm)}
.tb-mode{font-size:13px;color:var(--t3)}.tb-sep{font-size:13px;color:var(--t4);margin:0 2px}.tb-page{font-size:14px;font-weight:600;color:var(--txt)}
.topbar-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{width:34px;height:34px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;border:1px solid transparent;background:none;cursor:pointer;position:relative;transition:var(--tr)}
.icon-btn:hover{background:var(--sm)}
.icon-btn svg{width:16px;height:16px;stroke:var(--t2);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--rose);border:2px solid var(--white);position:absolute;top:5px;right:5px;display:none}
.tava{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Mono',monospace}
.content{padding:24px 28px 60px;flex:1;transition:opacity .15s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hero{border-radius:var(--rl);padding:26px 28px;color:#fff;position:relative;overflow:hidden;margin-bottom:22px}
.hero-ind{background:linear-gradient(135deg,#4338CA,#6366F1 60%,#818CF8)}
.hero-eme{background:linear-gradient(135deg,#047857,#059669 60%,#34D399)}
.hero-dark{background:linear-gradient(135deg,#1E1B4B,#312E81 60%,#4338CA)}
.hero::after{content:'';position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero::before{content:'';position:absolute;right:60px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.04)}
.hero-eye{font-size:11px;font-weight:500;opacity:.65;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;font-family:'DM Mono',monospace}
.hero-title{font-size:24px;font-weight:600;line-height:1.2;margin-bottom:5px;letter-spacing:-.5px}
.hero-sub{font-size:13px;opacity:.8;line-height:1.5;max-width:560px}
.hero-chips{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.hchip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(255,255,255,.15);color:#fff}
.hchip-hi{background:rgba(255,255,255,.28);font-weight:600}
.hero-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hbtn{padding:8px 18px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:var(--tr)}
.hbtn-pri{background:#fff;color:var(--ind)}.hbtn-pri:hover{background:var(--ind-ll);transform:translateY(-1px)}
.hbtn-gho{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3)}.hbtn-gho:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.stat-grid{display:grid;gap:14px;margin-bottom:22px}
.sg2{grid-template-columns:repeat(2,1fr)}.sg3{grid-template-columns:repeat(3,1fr)}.sg4{grid-template-columns:repeat(4,1fr)}
.stat-card{background:var(--white);border:1px solid var(--sb);border-radius:var(--r);padding:18px;box-shadow:var(--sh);cursor:pointer;position:relative;overflow:hidden;transition:var(--tr)}
.stat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:transparent;transition:background .2s}
.stat-card:hover{border-color:var(--ind-l);box-shadow:var(--sh-md);transform:translateY(-2px)}
.stat-card:hover::after{background:var(--ind)}
.stat-ico{width:34px;height:34px;border-radius:9px;margin-bottom:12px;display:flex;align-items:center;justify-content:center}
.si-ind{background:var(--ind-ll)}.si-eme{background:var(--eme-l)}.si-amb{background:var(--amb-l)}.si-rose{background:var(--rose-l)}
.stat-val{font-size:24px;font-weight:600;color:var(--txt);line-height:1;letter-spacing:-.6px;font-family:'DM Mono',monospace;margin-bottom:4px}
.stat-lbl{font-size:12px;color:var(--t2);font-weight:500}
.stat-delta{font-size:11px;color:var(--t3);margin-top:4px;font-family:'DM Mono',monospace}
.stat-delta.up{color:var(--eme)}
.card{background:var(--white);border:1px solid var(--sb);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px;transition:var(--tr)}
.card-hover{cursor:pointer}.card-hover:hover{border-color:var(--ind-l);box-shadow:var(--sh-md);transform:translateY(-1px)}
.card-p{border-left:3px solid var(--ind)}
.card-r{border-left:3px solid var(--rose)}
.card-g{border-left:3px solid var(--eme)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.sec{margin-bottom:20px}
.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shdr-t{font-size:14px;font-weight:600;color:var(--txt)}
.shdr-a{font-size:12px;color:var(--ind);cursor:pointer;font-weight:500;background:none;border:none;font-family:inherit;transition:var(--tr)}
.shdr-a:hover{color:var(--ind-d)}
.ct{font-size:14px;font-weight:500;color:var(--txt)}.cs{font-size:12px;color:var(--t2)}.cs2{font-size:11px;color:var(--t3)}.mono{font-family:'DM Mono',monospace}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:var(--tr);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--ind);color:#fff}.btn-p:hover{background:var(--ind-d)}
.btn-g{background:var(--eme);color:#fff}.btn-g:hover{background:var(--eme-d)}
.btn-r{background:var(--rose);color:#fff}.btn-r:hover{background:var(--rose-d)}
.btn-sec{background:var(--sm);color:var(--t2);border:1px solid var(--sb)}.btn-sec:hover{background:var(--sb);color:var(--txt)}
.btn-ghost{background:transparent;color:var(--ind);border:1px solid var(--ind-l)}.btn-ghost:hover{background:var(--ind-ll)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:7px;border-radius:var(--rs)}
.btn-lg{padding:10px 22px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.be{background:var(--eme-l);color:var(--eme-d)}.ba{background:var(--ind-ll);color:var(--ind-d)}.bb{background:var(--amb-l);color:var(--amb-d)}.br{background:var(--rose-l);color:var(--rose-d)}
.prog{height:6px;background:var(--sb);border-radius:3px;overflow:hidden}
.prog-bar{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.pa{background:var(--ind)}.pe{background:var(--eme)}.pam{background:var(--amb)}.pr{background:var(--rose)}
.pmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);font-family:'DM Mono',monospace;margin-top:4px}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--sb);background:var(--white);box-shadow:var(--sh);margin-bottom:14px}
table{width:100%;border-collapse:collapse}
thead{background:var(--sl)}
th{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s}
th:hover{color:var(--txt)}
th.sort-asc::after{content:' ↑';color:var(--ind)}
th.sort-desc::after{content:' ↓';color:var(--ind)}
td{padding:12px 14px;font-size:13px;border-top:1px solid var(--sb);color:var(--txt);vertical-align:middle}
tr:hover td{background:var(--sl)}
.field{width:100%;padding:9px 12px;border:1px solid var(--sb);border-radius:var(--rs);font-size:13px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--txt);transition:border-color .15s,box-shadow .15s;outline:none}
.field:focus{border-color:var(--ind-l);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.field::placeholder{color:var(--t3)}
select.field{cursor:pointer}
.field-group{margin-bottom:14px}
.field-label{font-size:12px;font-weight:500;color:var(--t2);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.field-label .req{color:var(--rose)}
.field.invalid{border-color:var(--rose)}
.pill-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;background:var(--sm);color:var(--t2);border:1px solid var(--sb);cursor:pointer;transition:var(--tr);font-family:'DM Sans',sans-serif}
.pill:hover{background:var(--sb);color:var(--txt)}
.pill.on{background:var(--ind-ll);color:var(--ind-d);border-color:var(--ind-l);font-weight:600}
.tab-bar{display:flex;border-bottom:2px solid var(--sb);margin-bottom:18px}
.tab-btn{padding:9px 16px;font-size:13px;font-weight:500;color:var(--t2);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--tr);font-family:'DM Sans',sans-serif}
.tab-btn:hover{color:var(--txt)}
.tab-btn.on{color:var(--ind);border-bottom-color:var(--ind);font-weight:600}
.tab-pane{display:none}.tab-pane.on{display:block}
.chat-wrap{background:var(--sl);border-radius:var(--r);border:1px solid var(--sb);padding:14px;height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px;scroll-behavior:smooth}
.msg{display:flex;flex-direction:column;max-width:80%}
.msg-me{align-self:flex-end;align-items:flex-end}
.msg-other{align-self:flex-start;align-items:flex-start}
.msg-name{font-size:10px;color:var(--t3);margin-bottom:3px;font-weight:500}
.msg-bubble{padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.4}
.msg-me .msg-bubble{background:var(--ind);color:#fff;border-bottom-right-radius:3px}
.msg-other .msg-bubble{background:var(--white);border:1px solid var(--sb);color:var(--txt);border-bottom-left-radius:3px}
.msg-time{font-size:10px;color:var(--t3);margin-top:2px;font-family:'DM Mono',monospace}
.notif-panel{position:fixed;top:52px;right:0;width:320px;background:var(--white);border-left:1px solid var(--sb);border-bottom:1px solid var(--sb);box-shadow:var(--sh-lg);z-index:200;max-height:calc(100vh - 52px);overflow-y:auto;transform:translateX(100%);transition:transform .2s ease}
.notif-panel.open{transform:translateX(0)}
.notif-panel-hdr{padding:14px 16px;border-bottom:1px solid var(--sb);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:1}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--sb);cursor:pointer;transition:background .15s;display:flex;gap:10px;align-items:flex-start}
.notif-item:hover{background:var(--sl)}
.notif-item.unread{background:var(--ind-ll)}
.notif-ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-t{font-size:13px;font-weight:500;color:var(--txt)}.notif-b{font-size:12px;color:var(--t2)}.notif-time{font-size:10px;color:var(--t3);font-family:'DM Mono',monospace;margin-top:3px}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px);padding:20px}
.modal-ov.open{display:flex;animation:fadeUp .15s ease}
.modal{background:var(--white);border-radius:var(--rl);box-shadow:var(--sh-lg);width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow-y:auto}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hdr{padding:18px 20px 14px;border-bottom:1px solid var(--sb);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:1}
.modal-title{font-size:16px;font-weight:600;color:var(--txt)}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--sb);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--white)}
.close-btn{width:28px;height:28px;border-radius:6px;background:var(--sm);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:var(--tr)}
.close-btn:hover{background:var(--sb)}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.k-col{background:var(--sl);border-radius:var(--r);padding:12px;border:1px solid var(--sb);min-height:200px;transition:background .15s}
.k-col.drag-over{background:var(--ind-ll);border-color:var(--ind-l)}
.k-col-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.k-col-title{font-size:12px;font-weight:600;color:var(--txt)}
.k-count{width:20px;height:20px;border-radius:50%;background:var(--sb);color:var(--t2);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.k-card{background:var(--white);border:1px solid var(--sb);border-radius:var(--rs);padding:12px;margin-bottom:8px;cursor:grab;box-shadow:var(--sh);transition:var(--tr);animation:fadeUp .2s ease}
.k-card:hover{box-shadow:var(--sh-md);border-color:var(--ind-l);transform:translateY(-1px)}
.k-card.dragging{opacity:.45;cursor:grabbing;transform:scale(.97)}
.k-drop-hint{height:48px;border:2px dashed var(--ind-l);border-radius:var(--rs);margin-bottom:8px;background:var(--ind-ll);display:none;align-items:center;justify-content:center;font-size:12px;color:var(--ind)}
.k-col.drag-over .k-drop-hint{display:flex}
.stars{display:flex;gap:2px}
.star{font-size:18px;cursor:pointer;color:var(--t4);transition:color .1s;user-select:none;line-height:1}
.star.on{color:#F59E0B}
.stars:hover .star{color:#F59E0B}
.stars:hover .star:hover ~ .star{color:var(--t4)}
.search-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none;align-items:flex-start;justify-content:center;padding-top:80px;backdrop-filter:blur(3px)}
.search-ov.open{display:flex;animation:fadeUp .15s ease}
.search-box{background:var(--white);border-radius:var(--rl);box-shadow:var(--sh-lg);width:100%;max-width:520px;overflow:hidden}
.search-inp-wrap{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--sb)}
.search-inp{flex:1;font-size:15px;border:none;outline:none;font-family:'DM Sans',sans-serif;background:transparent;color:var(--txt)}
.search-inp::placeholder{color:var(--t3)}
.search-results{max-height:360px;overflow-y:auto}
.search-group{padding:8px 0}
.search-group-title{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;padding:4px 16px 6px}
.search-item{padding:9px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s}
.search-item:hover{background:var(--sl)}
.search-item-title{font-size:13px;font-weight:500;color:var(--txt)}
.search-item-sub{font-size:11px;color:var(--t3)}
.search-empty{padding:40px;text-align:center;color:var(--t3);font-size:13px}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--txt);color:#fff;padding:10px 16px;border-radius:var(--rs);font-size:13px;font-weight:500;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:8px;max-width:320px;pointer-events:auto;animation:toastIn .25s ease;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(10px)}
.toast-s{background:var(--eme)}.toast-e{background:var(--rose)}.toast-w{background:var(--amb)}.toast-i{background:var(--ind)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.crs-card{background:var(--white);border:1px solid var(--sb);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:var(--tr);box-shadow:var(--sh)}
.crs-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--ind-l)}
.crs-banner{height:80px;display:flex;align-items:center;justify-content:center;position:relative}
.crs-body{padding:14px}
.crs-title{font-size:14px;font-weight:600;color:var(--txt);line-height:1.3;margin-bottom:4px}
.crs-meta{font-size:11px;color:var(--t3)}
.crs-foot{padding:12px 14px;border-top:1px solid var(--sb);display:flex;align-items:center;justify-content:space-between}
.wiz-steps{display:flex;align-items:center;margin-bottom:28px}
.wiz-step{display:flex;align-items:center;gap:8px;flex:1}
.wiz-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--sb);background:var(--white);color:var(--t3);transition:var(--tr);flex-shrink:0}
.wiz-dot.done{background:var(--eme);border-color:var(--eme);color:#fff}
.wiz-dot.active{background:var(--ind);border-color:var(--ind);color:#fff;box-shadow:0 0 0 4px var(--ind-ll)}
.wiz-label{font-size:12px;color:var(--t3);font-weight:500;white-space:nowrap}
.wiz-label.active{color:var(--ind);font-weight:600}
.wiz-line{flex:1;height:2px;background:var(--sb);margin:0 6px}
.wiz-line.done{background:var(--eme)}
.wiz-pane{display:none}.wiz-pane.on{display:block;animation:fadeUp .2s ease}
.ava{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;font-family:'DM Mono',monospace}
.dv{height:1px;background:var(--sb);margin:10px 0}
.tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:var(--ind-ll);color:var(--ind-d)}
.range-wrap{padding:4px 0 8px}
input[type=range]{width:100%;accent-color:var(--ind);cursor:pointer;height:4px}
.confirm-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.confirm-ov.open{display:flex;animation:fadeUp .15s}
.confirm-box{background:var(--white);border-radius:var(--rl);padding:24px;max-width:380px;width:90%;box-shadow:var(--sh-lg)}
.skill-bar-wrap{margin-bottom:10px}
.skill-bar-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:4px}
.skill-bar{height:8px;background:var(--sb);border-radius:4px;overflow:hidden}
.skill-bar-fill{height:100%;background:var(--ind);border-radius:4px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:typingPulse 1.2s infinite;display:inline-block}
.typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typingPulse{0%,60%,100%{transform:scale(1);opacity:.4}30%{transform:scale(1.3);opacity:1}}
.tipo-opt{cursor:pointer;transition:all .15s}
.tipo-opt.sel{background:var(--ind-ll) !important;border-color:var(--ind) !important}

function setMode(m){
  APP.mode=m;
  document.querySelectorAll('#sidebar .nav-btn[id^=mb-]').forEach(b=>b.classList.remove('on'));
  document.getElementById('mb-'+m).classList.add('on');
  const pf={emp:{ava:'TG',cls:'ap',name:'Tecno Grupo',role:'Plan Empresa'},est:{ava:'LA',cls:'ae',name:'Luis Acosta',role:'Estudiante · UANL'},dash:{ava:'MC',cls:'ar',name:'Los Socios',role:'Administrador'}}[m];
  document.getElementById('user-ava').textContent=pf.ava;
  document.getElementById('user-ava').className=`ava u-ava ${pf.cls}`;
  document.getElementById('tava').textContent=pf.ava;
  document.getElementById('tava').className=`ava tava ${pf.cls}`;
  document.getElementById('user-name').textContent=pf.name;
  document.getElementById('user-role').textContent=pf.role;
  buildSidebarNav(m);
  goTab(m,APP.tab[m]);
}
function buildSidebarNav(m){
  const unread=APP.notifications.filter(n=>!n.read).length;
  document.getElementById('sidebar-nav').innerHTML=NAV[m].map(item=>{
    const active=APP.tab[m]===item.id;
    const badge=(m==='emp'&&item.id==='msgs'&&unread>0)?`<div class="bdot">${unread}</div>`:'';
    return `<button class="nav-btn${active?' on':''}" onclick="goTab('${m}','${item.id}')" id="nb-${item.id}">${ic(item.icon,15)}<span class="nav-lbl">${item.label}</span>${badge}</button>`;
  }).join('');
  const sq=document.getElementById('sidebar-quick');
  sq.innerHTML=m==='emp'?`<span class="s-section-lbl">Acceso rápido</span><div class="sidebar-quick-inner">${btn(ic('plus',13)+' Proyecto','btn-p btn-sm',false,false,"goTab('emp','new')")}</div>`:'';
}
function goTab(m,t){
  APP.tab[m]=t;
  if(APP.mode!==m)setMode(m);
  document.querySelectorAll('#sidebar-nav .nav-btn').forEach(b=>b.classList.remove('on'));
  const nb=document.getElementById('nb-'+t);
  if(nb)nb.classList.add('on');
  document.getElementById('tb-mode').textContent=MODELABELS[m];
  document.getElementById('tb-page').textContent=TABS[m][t]||t;
  const fn=SCREENS[m]&&SCREENS[m][t];
  const ct=document.getElementById('content');
  ct.style.opacity='0';
  setTimeout(()=>{
    ct.innerHTML=fn?fn():`<div style="text-align:center;padding:80px;color:var(--t3)"><div style="font-size:40px;margin-bottom:12px">🚧</div><div style="font-size:16px;font-weight:600">En construcción</div></div>`;
    ct.style.opacity='1';
    postRender(m,t);
    updateNotifDot();
  },80);
}
function postRender(m,t){
  // Pill filters
  document.querySelectorAll('.pill[data-filter]').forEach(b=>{
    b.addEventListener('click',function(){
      const g=this.dataset.group;
      APP.filters[g]=this.dataset.filter;
      document.querySelectorAll(`.pill[data-group="${g}"]`).forEach(x=>x.classList.remove('on'));
      this.classList.add('on');
      document.querySelectorAll(`[data-filter-group="${g}"]`).forEach(el=>{
        const f=APP.filters[g];
        el.style.display=(f==='all'||f==='todos'||f===el.dataset.fval)?'':'none';
      });
    });
  });
  // Table sort
  document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>sortTable(th)));
  // Progress bars animate
  setTimeout(()=>{
    document.querySelectorAll('.prog-bar[data-w]').forEach(b=>{b.style.width=b.dataset.w+'%'});
    document.querySelectorAll('.skill-bar-fill[data-w]').forEach(b=>{b.style.width=b.dataset.w+'%'});
  },60);
  // Chat
  if(m==='emp'&&t==='msgs')renderChat();
  // Kanban
  if(m==='dash'&&t==='kanban')initKanban();
  // KPI sliders
  if(m==='dash'&&t==='rev')initKpiSliders();
  // Wizard
  if(m==='emp'&&t==='new')updateWizDots();
}

function openAssignModal(sid){

function doAssign(sid){
  const sel=document.querySelector('input[name="assign-proj"]:checked');

  const s=APP.students.find(x=>x.id===sid);

    :`<button class="btn btn-sec" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="enrollCourse(${id})">Inscribirme — ${fmtMXN(c.price)}</button>`;

function enrollCourse(id){
  if(!APP.myEnrolledCourses.includes(id)){
    APP.myEnrolledCourses.push(id);
    const c=APP.courses.find(x=>x.id===id);
    if(c)c.enrolled++;
    closeModal();showToast('Inscrito exitosamente','success');render();
  }
}
function unenrollCourse(id){
  confirmAction('¿Cancelar inscripción?','Perderás tu lugar en el curso.',()=>{
    APP.myEnrolledCourses=APP.myEnrolledCourses.filter(x=>x!==id);
    const c=APP.courses.find(x=>x.id===id);
    if(c)c.enrolled--;
    closeModal();showToast('Inscripción cancelada','info');render();
  });
}

function doSearch(q){
  const res=document.getElementById('search-results');
  if(!q.trim()){res.innerHTML='<div class="search-empty">Escribe para buscar...</div>';return;}
  const ql=q.toLowerCase();
  const projs=APP.projects.filter(p=>p.name.toLowerCase().includes(ql)||p.type.toLowerCase().includes(ql)||p.consultant.toLowerCase().includes(ql));
  const studs=APP.students.filter(s=>s.name.toLowerCase().includes(ql)||s.career.toLowerCase().includes(ql)||s.skills.some(sk=>sk.toLowerCase().includes(ql)));
  const cours=APP.courses.filter(c=>c.name.toLowerCase().includes(ql)||c.tags.some(t=>t.toLowerCase().includes(ql)));
  if(!projs.length&&!studs.length&&!cours.length){res.innerHTML=`<div class="search-empty">Sin resultados para "${q}"</div>`;return;}
  let html='';
  if(projs.length)html+=`<div class="search-group"><div class="search-group-title">Proyectos</div>${projs.map(p=>`<div class="search-item" onclick="openProjectModal(${p.id});closeSearch()">${ava(p.ci,p.cc,28)}<div><div class="search-item-title">${p.name}</div><div class="search-item-sub">${p.consultant}</div></div></div>`).join('')}</div>`;
  if(studs.length)html+=`<div class="search-group"><div class="search-group-title">Estudiantes</div>${studs.map(s=>`<div class="search-item" onclick="openStudentModal(${s.id});closeSearch()">${ava(s.init,s.cls,28)}<div><div class="search-item-title">${s.name}</div><div class="search-item-sub">${s.career} · ${s.uni}</div></div></div>`).join('')}</div>`;
  if(cours.length)html+=`<div class="search-group"><div class="search-group-title">Cursos</div>${cours.map(c=>`<div class="search-item" onclick="openCourseModal(${c.id});closeSearch()"><div style="width:28px;height:28px;border-radius:6px;background:var(--sl);display:flex;align-items:center;justify-content:center">${emo[c.cat]||'📚'}</div><div><div class="search-item-title">${c.name}</div><div class="search-item-sub">${c.level} · ${fmtMXN(c.price)}</div></div></div>`).join('')}</div>`;
  res.innerHTML=html;
}

// TABLE SORT
function sortTable(th){
  const col=th.dataset.sort;
  const tbody=th.closest('table').querySelector('tbody');
  const rows=Array.from(tbody.querySelectorAll('tr'));
  const dir=APP.sortState.col===col&&APP.sortState.dir==='asc'?'desc':'asc';
  APP.sortState={col,dir};
  th.closest('thead').querySelectorAll('th').forEach(h=>h.classList.remove('sort-asc','sort-desc'));
  th.classList.add('sort-'+dir);
  const ci=parseInt(th.dataset.colIdx||'0');
  rows.sort((a,b)=>{
    const av=a.dataset[col]||a.cells[ci]?.textContent.trim()||'';
    const bv=b.dataset[col]||b.cells[ci]?.textContent.trim()||'';
    const an=parseFloat(av.replace(/[^0-9.-]/g,''));
    const bn=parseFloat(bv.replace(/[^0-9.-]/g,''));
    if(!isNaN(an)&&!isNaN(bn))return dir==='asc'?an-bn:bn-an;
    return dir==='asc'?av.localeCompare(bv,'es'):bv.localeCompare(av,'es');
  });
  rows.forEach(r=>tbody.appendChild(r));
}

// KANBAN DRAG & DROP
function initKanban(){
  document.querySelectorAll('.k-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      APP.dragState.dragging=parseInt(card.dataset.projId);
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>{
      card.classList.remove('dragging');
      document.querySelectorAll('.k-col').forEach(c=>c.classList.remove('drag-over'));
    });
  });
  document.querySelectorAll('.k-col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',e=>{
      e.preventDefault();
      const newStatus=col.dataset.status;
      const p=APP.projects.find(x=>x.id===APP.dragState.dragging);
      if(p&&newStatus&&p.status!==newStatus){
        p.status=newStatus;
        if(newStatus==='done')p.pct=100;
        else if(newStatus==='review'&&p.pct<70)p.pct=70;
        else if(newStatus==='active'&&p.pct===0)p.pct=5;
        showToast('"'+p.name+'" movido a '+col.querySelector('.k-col-title').textContent,'success');
        goTab('dash','kanban');
      }
      col.classList.remove('drag-over');APP.dragState.dragging=null;
    });
  });
}

function updateKpi(){
  const companies=parseInt(document.getElementById('sl-companies')?.value||8);
  const revPerProj=parseInt(document.getElementById('sl-rev')?.value||6500);
  const projsPerCo=parseFloat(document.getElementById('sl-proj')?.value||1.5);
  APP.kpis.companies=companies;
  APP.kpis.memberships=companies*2500;
  const totalProjs=Math.round(companies*projsPerCo);
  APP.kpis.revenue=totalProjs*revPerProj;
  APP.kpis.commission=Math.round(APP.kpis.revenue*.25);
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('kpi-mem',fmtMXN(APP.kpis.memberships));
  set('kpi-com',fmtMXN(APP.kpis.commission));
  set('kpi-tot',fmtMXN(APP.kpis.memberships+APP.kpis.commission+APP.kpis.courses));
  set('sl-co-lbl',companies+' empresas');
  set('sl-rev-lbl',fmtMXN(revPerProj)+'/proyecto');
  set('sl-proj-lbl',projsPerCo+' proy/empresa');
  set('kpi-co-val',companies+' empresas');
  set('kpi-rev-val',fmtMXN(revPerProj)+'/proyecto');
  const vals=[APP.kpis.memberships,APP.kpis.commission,APP.kpis.courses];
  const max=Math.max(...vals);
  document.querySelectorAll('.kpi-bar').forEach((b,i)=>{b.style.height=Math.round(vals[i]/max*100)+'%';});
}
function initKpiSliders(){

function autoMatch(){
  showToast('Analizando perfiles con IA...','info');
  setTimeout(()=>showToast('Match encontrado: Mónica Álvarez (92% compat.)','success'),1800);
}
function openManualMatch(){
  openModal('Match manual',`
    <div class="cs" style="margin-bottom:12px">Selecciona el consultor para <b>Análisis costos — Flowtask SaaS</b>:</div>
    ${APP.students.filter(s=>s.available).map(s=>`
      <label style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--sb);border-radius:var(--rs);margin-bottom:8px;cursor:pointer" onmouseover="this.style.background='var(--sl)'" onmouseout="this.style.background=''">
        <input type="radio" name="manual-match" value="${s.id}" style="accent-color:var(--ind)">
        ${ava(s.init,s.cls,32)}
        <div style="flex:1"><div style="font-weight:500">${s.name}</div><div class="cs2">${s.career} · ★ ${s.rating}</div></div>
        <span style="font-weight:600;color:var(--eme)">${Math.floor(Math.random()*30+60)}% match</span>
      </label>`).join('')}
  `,`<button class="btn btn-sec" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="confirmManualMatch()">Confirmar match</button>`);
}
function confirmManualMatch(){
  const sel=document.querySelector('input[name="manual-match"]:checked');
  if(!sel){showToast('Selecciona un consultor','error');return;}
  const s=APP.students.find(x=>x.id===parseInt(sel.value));
  closeModal();showToast('Match confirmado: '+s.name+' asignado','success');
}
